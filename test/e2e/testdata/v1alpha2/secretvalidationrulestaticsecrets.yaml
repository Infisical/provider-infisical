apiVersion: secretvalidationrule.crossplane.infisical.com/v1alpha2
kind: SecretValidationRuleStaticSecrets
metadata:
  name: __PREFIX__-secret-validation-rule-static-secrets
  labels:
    e2e.infisical.com/run: __RUN_ID__
spec:
  providerConfigRef:
    name: __PROVIDER_CONFIG__
  forProvider:
    name: e2e-static-secrets
    description: crossplane e2e test
    environment: dev
    # A path that no other fixture uses, so the rule does not apply to the
    # Secret of the test.
    secretPath: /e2e-validation/**
    constraints:
      keyConstraints:
        requiredPrefix: E2E_
      valueConstraints:
        minLength: 8
    projectIdRef:
      name: __PREFIX__-project
