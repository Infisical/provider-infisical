apiVersion: project.crossplane.infisical.com/v1alpha2
kind: AccessApprovalPolicy
metadata:
  name: __PREFIX__-access-approval-policy
  labels:
    e2e.infisical.com/run: __RUN_ID__
spec:
  providerConfigRef:
    name: __PROVIDER_CONFIG__
  forProvider:
    name: e2e-access-policy
    projectIdRef:
      name: __PREFIX__-project
    environmentSlugs:
      - prod
    secretPath: /
    requiredApprovals: 1
    enforcementLevel: soft
    approvers:
      - type: user
        username: __USER_EMAIL__
