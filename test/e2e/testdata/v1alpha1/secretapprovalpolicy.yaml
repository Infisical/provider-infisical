apiVersion: project.crossplane.infisical.com/v1alpha1
kind: SecretApprovalPolicy
metadata:
  name: __PREFIX__-secret-approval-policy
  labels:
    e2e.infisical.com/run: __RUN_ID__
spec:
  providerConfigRef:
    name: __PROVIDER_CONFIG__
  forProvider:
    name: e2e-secret-policy
    projectIdRef:
      name: __PREFIX__-project
    environmentSlugs:
      - prod
    secretPath: /
    requiredApprovals: 1
    enforcementLevel: soft
    userApprovers:
      - __USER_EMAIL__
