apiVersion: secret.crossplane.infisical.com/v1alpha1
kind: Secret
metadata:
  name: __PREFIX__-secret
  labels:
    e2e.infisical.com/run: __RUN_ID__
spec:
  providerConfigRef:
    name: __PROVIDER_CONFIG__
  forProvider:
    name: E2E_SECRET
    envSlug: dev
    folderPath: /
    workspaceId: __PROJECT_ID__
    valueSecretRef:
      name: __PREFIX__-secret-value
      namespace: crossplane-system
      key: value
