apiVersion: secretsync.crossplane.infisical.com/v1alpha1
kind: SecretSyncGithub
metadata:
  name: __PREFIX__-secret-sync-github
  labels:
    e2e.infisical.com/run: __RUN_ID__
spec:
  providerConfigRef:
    name: __PROVIDER_CONFIG__
  forProvider:
    name: __PREFIX__-__RUN_ID__
    description: crossplane e2e test
    connectionId: __GITHUB_CONNECTION_ID__
    environment: dev
    secretPath: /
    projectIdRef:
      name: __PREFIX__-project
    destinationConfig: '{"scope":"repository","repository_owner":"__GITHUB_REPO_OWNER__","repository_name":"__GITHUB_REPO_NAME__"}'
    syncOptions: '{"initial_sync_behavior":"overwrite-destination","disable_secret_deletion":true,"key_schema":"E2E_{{secretKey}}"}'
