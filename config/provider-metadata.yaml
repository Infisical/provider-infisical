name: Infisical/infisical
resources:
    infisical_access_approval_policy:
        subCategory: Approval
        description: Create access approval policy for your projects
        name: infisical_access_approval_policy
        title: infisical_access_approval_policy Resource - terraform-provider-infisical
        examples:
            - name: prod-policy
              manifest: |-
                {
                  "allow_self_approval": true,
                  "approvers": [
                    {
                      "id": "7c13f73b-c09b-4752-aea6-9b691ba3eb45",
                      "type": "group"
                    },
                    {
                      "type": "user",
                      "username": "admin@infisical.com"
                    }
                  ],
                  "bypassers": [
                    {
                      "id": "7c13f73b-c09b-4752-aea6-9b691ba3eb45",
                      "type": "group"
                    },
                    {
                      "id": "admin@infisical.com",
                      "type": "user"
                    }
                  ],
                  "enforcement_level": "soft",
                  "environment_slugs": [
                    "prod"
                  ],
                  "max_time_period": "24h",
                  "name": "my-approval-policy",
                  "project_id": "${infisical_project.example.id}",
                  "request_expiration_time": "72h",
                  "required_approvals": 1,
                  "secret_path": "/"
                }
              references:
                project_id: infisical_project.example.id
              dependencies:
                infisical_project.example: |-
                    {
                      "name": "example",
                      "slug": "example"
                    }
        argumentDocs:
            allow_self_approval: (Boolean) Whether to allow approvers to approve their own requests
            approvers: (Attributes Set) The required approvers (see below for nested schema)
            bypassers: (Attributes Set) The bypassers who can bypass the approval policy (see below for nested schema)
            enforcement_level: (String) The enforcement level of the policy. This can either be hard or soft
            environment_slug: (String) (DEPRECATED, Use environment_slugs instead) The environment to apply the access approval policy to
            environment_slugs: (List of String) The environments to apply the access approval policy to
            id: (String) The ID of the access approval policy
            max_time_period: (String) The maximum time period for the access approval, specified as a duration string (e.g. '1h', '30m', '2d'). If omitted, the default behavior is 'permanent'.
            name: (String) The name of the access approval policy
            project_id: (String) The ID of the project to add the access approval policy
            request_expiration_time: (String) The time after which the access request expires, specified as a duration string (e.g. '1h', '3d', '72h'). Must be between 1 minute and 1 year. If omitted, the default behavior is 'never'.
            required_approvals: (Number) The number of required approvers
            secret_path: (String) The secret path to apply the access approval policy to
            type: (String) The type of approver. Either group or user
            username: (String) The username of the approver. By default, this is the email
        importStatements: []
    infisical_alert:
        subCategory: Alerts
        description: Create and manage alerts that notify you about a resource in Infisical. An alert watches one resource for one event, and a resource can only have one alert per event within a scope.
        name: infisical_alert
        title: infisical_alert Resource - terraform-provider-infisical
        examples:
            - name: ci_identity
              manifest: |-
                {
                  "channels": {
                    "security_team": {
                      "email": {
                        "recipients": [
                          {
                            "id": "\u003cyour-user-id\u003e",
                            "type": "user"
                          },
                          {
                            "id": "\u003cyour-group-id\u003e",
                            "type": "group"
                          }
                        ]
                      },
                      "name": "Security team"
                    }
                  },
                  "description": "Rotate the CI machine identity client secret before it expires",
                  "expiry": {
                    "alert_before_days": 30
                  },
                  "name": "CI identity credentials expiring",
                  "resource_id": "\u003cyour-machine-identity-id\u003e",
                  "resource_type": "identity.authentication"
                }
            - name: deploy_identity
              manifest: |-
                {
                  "channels": {
                    "internal_automation": {
                      "name": "Internal automation",
                      "webhook": {
                        "signing_secret": "\u003csigning-secret\u003e",
                        "url": "https://example.com/infisical-alerts"
                      }
                    },
                    "on_call": {
                      "enabled": false,
                      "name": "On-call",
                      "pagerduty": {
                        "integration_key": "\u003cyour-pagerduty-events-api-v2-integration-key\u003e"
                      }
                    },
                    "platform_slack": {
                      "name": "Platform Slack",
                      "slack": {
                        "webhook_url": "https://hooks.slack.com/services/\u003cyour-slack-webhook-path\u003e"
                      }
                    }
                  },
                  "expiry": {
                    "alert_before_days": 7,
                    "daily_reminder": true
                  },
                  "name": "Deploy identity credentials expiring",
                  "project_id": "\u003cyour-project-id\u003e",
                  "resource_id": "\u003cyour-machine-identity-id\u003e",
                  "resource_type": "identity.authentication"
                }
        argumentDocs:
            alert_before_days: (Number) How many days before the watched resource expires the alert fires. Must be between 1 and 90.
            channels: (Attributes Map) The channels the alert is delivered to, keyed by a name of your choosing. The key is what identifies a channel to Terraform and is never sent to Infisical, so renaming a channel updates it in place and it keeps the deliveries it has already made. Changing a key, on the other hand, deletes the channel and creates a new one, so the new channel notifies about everything that is still expiring, even if the old one already did. Each channel carries exactly one configuration block, and that block is what gives the channel its type. At least one and at most 10 channels are allowed. (see below for nested schema)
            daily_reminder: (Boolean) Whether to keep notifying once a day until the watched resource expires, instead of notifying once. Defaults to false.
            description: (String) An optional description of the alert.
            email: (Attributes) Notifies principals of your organization or project by email. (see below for nested schema)
            enabled: (Boolean) Whether the alert is evaluated. Defaults to true.
            expiry: '(Attributes) Fires before the watched resource expires. Only for alerts on these resource types: identity.authentication. (see below for nested schema)'
            id: (String) The ID of the alert.
            integration_key: '(String, Sensitive) The PagerDuty Events API v2 integration key incidents are created with, a 32 character hex string. Write-only: it is never returned by the API, so it cannot be imported.'
            name: (String) The name of the alert.
            org_id: (String) The ID of the organization the alert belongs to. Always set, whether the alert is scoped to the organization or to a project, so it is what tells you which organization a project level alert was created under.
            pagerduty: (Attributes) Creates PagerDuty incidents through the Events API v2. (see below for nested schema)
            project_id: (String) The ID of the project the resource belongs to. Required for project level resources, and must be omitted for organization level ones.
            recipients: (Attributes Set) The principals to notify. At least one and at most 20 are allowed. (see below for nested schema)
            resource_id: (String) The ID of the resource to watch. For the identity.authentication resource type this is a machine identity's ID.
            resource_type: '(String) The type of the resource to watch. Options: identity.authentication.'
            signing_secret: '(String, Sensitive) The secret used to sign the payload so the receiver can verify it. Write-only: it is never returned by the API, so an imported channel keeps the secret it was created with until one is set here.'
            slack: (Attributes) Posts notifications to a Slack channel through an incoming webhook. (see below for nested schema)
            type: '(String) The type of the recipient. Options: user, group.'
            url: (String) The HTTPS URL the CloudEvents payload is sent to.
            webhook: (Attributes) Sends notifications to an HTTPS endpoint as a CloudEvents payload. (see below for nested schema)
            webhook_url: '(String, Sensitive) The Slack incoming webhook URL notifications are posted to. Must be a https://hooks.slack.com URL. Write-only: it is never returned by the API, so it cannot be imported.'
        importStatements:
            - |-
              terraform import infisical_alert.example <alert_id>

              # An imported alert keys each of its channels by the name it has in Infisical, so write the
              # channels in your configuration under those same keys, or the import deletes them and creates
              # new ones that notify about everything still expiring, even though the imported channels
              # already did. The keys are yours to choose from then on, since only the name attribute reaches
              # Infisical.
              #
              # Write-only channel secrets (a Slack webhook URL, a PagerDuty integration key, a webhook
              # signing secret) are never returned by the API, so the first plan after an import shows them
              # being set. A signing secret left out of the configuration keeps whatever is stored.
    infisical_app_connection_1password:
        subCategory: App Connections
        description: Create and manage 1Password App Connection
        name: infisical_app_connection_1password
        title: infisical_app_connection_1password Resource - terraform-provider-infisical
        examples:
            - name: one-password-demo
              manifest: |-
                {
                  "credentials": {
                    "api_token": "\u003cAPI_TOKEN\u003e",
                    "instance_url": "\u003chttps://1pass.example.com\u003e"
                  },
                  "description": "This is a demo 1password connection.",
                  "method": "api-token",
                  "name": "1password-demo"
                }
        argumentDocs:
            api_token: (String, Sensitive) The API token to use for authentication. For more details, refer to the documentation here infisical.com/docs/integrations/app-connections/1password
            credentials: (Attributes) The credentials for the 1Password App Connection (see below for nested schema)
            credentials_hash: (String) The hash of the 1Password App Connection credentials
            description: (String) An optional description for the 1Password App Connection.
            id: (String) The ID of the app connection
            instance_url: (String, Sensitive) The URL of the 1Password Connect instance to connect to. For more details, refer to the documentation here infisical.com/docs/integrations/app-connections/1password
            method: '(String) The method used to authenticate with 1Password. Possible values are: api-token'
            name: (String) The name of the 1Password App Connection to create. Must be slug-friendly
            project_id: (String) The ID of the project to scope the app connection to. If not provided, the app connection will be scoped to the organization.
        importStatements: []
