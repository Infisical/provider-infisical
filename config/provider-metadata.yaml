    infisical_secret_validation_rule_static_secrets:
        subCategory: Secret Validation Rules
        description: Create and manage Secret Validation Rules for Static Secrets
        name: infisical_secret_validation_rule_static_secrets
        title: infisical_secret_validation_rule_static_secrets Resource - terraform-provider-infisical
        examples:
            - name: static-secrets
              manifest: |-
                {
                  "constraints": {
                    "key_constraints": {
                      "regex_pattern": "^[A-Z][A-Z0-9_]*$",
                      "required_prefix": "APP_"
                    },
                    "value_constraints": {
                      "max_length": 128,
                      "min_length": 16,
                      "unique_across_last_versions": 10,
                      "unique_within_scope": true
                    }
                  },
                  "environment": "\u003cenvironment-slug\u003e",
                  "name": "static-secrets-validation-rule-example",
                  "project_id": "\u003cproject-id\u003e",
                  "secret_path": "/**"
                }
        argumentDocs:
            constraints: (Attributes) The constraints this Static Secrets rule enforces. (see below for nested schema)
            description: (String) An optional description of the secret validation rule.
            environment: (String) The slug of the environment to scope this rule to. Omit to enforce the rule in every environment of the project.
            id: (String) The ID of the secret validation rule.
            is_active: (Boolean) Whether the rule is enforced. An inactive rule is kept but ignored. Defaults to true.
            key_constraints: (Attributes) Constraints enforced on the secret key when a secret is created or renamed. Omit to leave keys unconstrained. (see below for nested schema)
            max_length: (Number) The maximum number of characters the secret key may contain.
            min_length: (Number) The minimum number of characters the secret key must contain.
            name: (String) The name of the secret validation rule.
            project_id: (String) The ID of the Infisical project to create the secret validation rule in.
            regex_pattern: (String) A regular expression the secret key must match.
            required_prefix: (String) A string the secret key must start with.
            required_suffix: (String) A string the secret key must end with.
            secret_path: (String) The secret path to scope this rule to. Supports glob patterns such as /apps/**.
            unique_across_last_versions: (Number) How many of the secret's own previous versions the new value must differ from. Between 1 and 25. Omit to allow a value that repeats a previous version.
            unique_within_scope: (Boolean) Set to true to reject a value that another secret in the rule's scope already holds. Requires blind indexing on the project. Omit to allow a value another secret already holds.
            value_constraints: (Attributes) Constraints enforced on the secret value when a secret is created or updated. Omit to leave values unconstrained. (see below for nested schema)
        importStatements:
            - |-
              # This will import the static secrets validation rule by its ID
              terraform import infisical_secret_validation_rule_static_secrets.example <rule_id>
    infisical_sub_organization:
        subCategory: Organization
        description: Create and manage sub-organizations in Infisical. Requires an Infisical Enterprise plan, and only Machine Identity authentication scoped to the root organization is supported. The authenticating identity needs the sub-organization create permission and must not be scoped to a sub-organization.
        name: infisical_sub_organization
        title: infisical_sub_organization Resource - terraform-provider-infisical
        examples:
            - name: example
              manifest: |-
                {
                  "name": "Engineering",
                  "slug": "engineering"
                }
        argumentDocs:
            id: (String) The ID of the sub-organization.
            name: (String) The name of the sub-organization.
            parent_org_id: (String) The ID of the parent (root) organization.
            slug: (String) The slug of the sub-organization. If omitted when the sub-organization is first created, Infisical generates one from the name. Changing this value updates the sub-organization. Once a slug is set, removing it from your configuration does not regenerate it; the existing value is retained.
        importStatements:
            - |-
              # This will import the sub-organization by its ID
              terraform import infisical_sub_organization.example <sub_organization_id>
    infisical_webhook:
        subCategory: Webhooks
        description: Create and manage webhooks in Infisical. Webhooks notify an external URL when secrets change at a given path.
        name: infisical_webhook
        title: infisical_webhook Resource - terraform-provider-infisical
        examples:
            - name: lambda_trigger
              manifest: |-
                {
                  "environment": "prod",
                  "events_filter": [
                    "secrets.modified"
                  ],
                  "project_id": "\u003cyour-project-id\u003e",
                  "secret_path": "/",
                  "webhook_secret_key": "\u003csigning-key\u003e",
                  "webhook_url": "https://example.com/infisical-webhook"
                }
        argumentDocs:
            environment: (String) The slug of the environment the webhook listens to.
            events_filter: '(Set of String) The events that trigger the webhook. Options: secrets.modified, secrets.rotation-failed. An empty set means the webhook fires on every supported event.'
            id: (String) The ID of the webhook.
            is_disabled: (Boolean) Whether the webhook is disabled. Defaults to false.
            project_id: (String) The ID of the project the webhook belongs to.
            secret_path: (String) The secret path the webhook listens to. Defaults to '/'.
            type: '(String) The webhook type. Options: general, slack, microsoft-teams. Defaults to ''general''.'
            webhook_secret_key: '(String, Sensitive) The secret key used to sign the webhook payload so the receiver can verify it. Write-only: it is never returned by the API, so it cannot be imported.'
            webhook_url: (String, Sensitive) The URL Infisical sends the event payload to.
        importStatements:
            - terraform import infisical_webhook.example <webhook_id>
