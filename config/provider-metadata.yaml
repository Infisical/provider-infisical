                      "ip_address": "0.0.0.0/0"
                    }
                  ],
                  "access_token_ttl": 2592000,
                  "allowed_common_names": [
                    "my-service.example.com"
                  ],
                  "allowed_subject_alt_names": [
                    "URI:spiffe://example.org/my-service"
                  ],
                  "ca_certificate": "${file(\"${path.module}/ca.pem\")}",
                  "identity_id": "${infisical_identity.machine-identity-1.id}",
                  "verify_client_certificate_chain": false
                }
              references:
                identity_id: infisical_identity.machine-identity-1.id
              dependencies:
                infisical_identity.machine-identity-1: |-
                    {
                      "name": "machine-identity-1",
                      "org_id": "\u003cyour-org-id\u003e",
                      "role": "admin"
                    }
        argumentDocs:
            access_token_max_ttl: '(Number) The maximum lifetime for an access token in seconds. This value will be referenced at renewal time. Default: 2592000'
            access_token_num_uses_limit: (Number) The maximum number of times that an access token can be used; a value of 0 implies infinite number of uses. Default:0
            access_token_trusted_ips: (Attributes List) A list of IPs or CIDR ranges that access tokens can be used from. You can use 0.0.0.0/0, to allow usage from any network address.. (see below for nested schema)
            access_token_ttl: '(Number) The lifetime for an access token in seconds. This value will be referenced at renewal time. Default: 2592000'
            allowed_common_names: (List of String) List of trusted common names that client certificates must have to authenticate with Infisical. When omitted, any common name is accepted.
            allowed_subject_alt_names: (List of String) List of trusted subject alternative names that client certificates must have to authenticate with Infisical. Non-DNS entries must be prefixed with their type (e.g. URI:spiffe://example.org/service, IP:10.0.0.1, EMAIL:svc@example.com). When omitted, any subject alternative name is accepted.
            ca_certificate: (String) The PEM-encoded CA certificate that client certificates must be issued by to authenticate with Infisical.
            id: (String) The ID of the tls certificate auth
            identity_id: (String) The ID of the identity to attach the configuration onto.
            ip_address: (String)
            verify_client_certificate_chain: '(Boolean) Whether to build and verify the full certificate chain presented by the client up to the configured CA certificate, instead of requiring the client certificate to be signed directly by it. Default: false'
        importStatements:
            - |-
              # This will import the resource by its identity ID
              terraform import infisical_identity_tls_cert_auth.example <identity_id>
