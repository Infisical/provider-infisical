            temporary_access_start_time: (String) ISO time for which temporary access should begin. The current time is used by default.
            temporary_mode: '(String) Type of temporary access given. Types: relative. Default: relative'
            temporary_range: '(String) TTL for the temporary time. Eg: 1m, 1h, 1d. Default: 1h'
            user: (Attributes) The user details of the project user (see below for nested schema)
            username: (String) The usename of the user. By default its the email
        importStatements:
            - terraform import infisical_project_user.example <project-id>,<user-id>
    infisical_secret:
        subCategory: Secrets
        description: Create secrets & save to Infisical
        name: infisical_secret
        title: infisical_secret Resource - terraform-provider-infisical
        examples:
            - name: mongo_secret
              manifest: |-
                {
                  "env_slug": "dev",
                  "folder_path": "/",
                  "name": "MONGO_DB",
                  "value": "\u003csome-key\u003e",
                  "workspace_id": "PROJECT_ID"
                }
              dependencies:
                infisical_secret_tag.terraform: |-
                    {
                      "color": "#fff",
                      "name": "terraform",
                      "project_id": "PROJECT_ID",
                      "slug": "terraform"
                    }
            - name: smtp_secret
              manifest: |-
                {
                  "env_slug": "dev",
                  "folder_path": "/mail-service",
                  "name": "SMTP",
                  "secret_reminder": {
                    "note": "Rotate this secret using X API",
                    "repeat_days": 30
                  },
                  "value": "\u003csome key\u003e",
                  "workspace_id": "PROJECT_ID"
                }
              dependencies:
                infisical_secret_tag.terraform: |-
                    {
                      "color": "#fff",
                      "name": "terraform",
                      "project_id": "PROJECT_ID",
                      "slug": "terraform"
                    }
            - name: github_action_secret
              manifest: |-
                {
                  "env_slug": "dev",
                  "folder_path": "/",
                  "name": "GITHUB_ACTION",
                  "tag_ids": [
                    "${infisical_secret_tag.terraform.id}"
                  ],
                  "value": "\u003csome value\u003e",
                  "workspace_id": "PROJECT_ID"
                }
              references:
                tag_ids: infisical_secret_tag.terraform.id
              dependencies:
                infisical_secret_tag.terraform: |-
                    {
                      "color": "#fff",
                      "name": "terraform",
                      "project_id": "PROJECT_ID",
                      "slug": "terraform"
                    }
        argumentDocs:
            env_slug: (String) The environment slug of the secret to modify/create
            folder_path: (String) The path to the folder where the given secret resides
            id: (String) The ID of the secret
            last_updated: (String) The last time the secret was updated.
            metadata: (Map of String) Metadata associated with the secret as key-value pairs.
            name: (String) The name of the secret
            note: (String) Note for the secret rotation reminder
            repeat_days: (Number) Frequency of secret rotation reminder in days
            secret_reminder: (Attributes) (see below for nested schema)
            tag_ids: (Set of String) Tag ids to be attached for the secrets.
            value: (String, Sensitive) The value of the secret in plain text. This is required if value_wo is not set.
            value_wo: (String) The value of the secret in plain text as a write-only secret. If set, the secret value will not be stored in state. This is required if value is not set. Requires Terraform version 1.11.0 or higher.
            value_wo_version: (Number) Used together with value_wo to trigger an update. Increment this value when an update to the value_wo is required.
            workspace_id: (String) The Infisical project ID (Required for Machine Identity auth, and service tokens with multiple scopes)
        importStatements:
            - |-
              # Import by Infisical secret UUID. The secret value is written to state under `value`.
              terraform import infisical_secret.example <secret_id>

              # Import by workspace, environment, folder path, and secret name. The secret value is written to state under `value`.
              terraform import infisical_secret.example '<workspace_id>:<env_slug>:<folder_path>:<secret_name>'

              # Import as write-only by prefixing the ID with `write-only:`. The secret value is NOT written to state; `value_wo_version` is initialized to 1 so a config with `value_wo_version = 1` will not trigger a spurious update on the first plan.
              terraform import infisical_secret.example 'write-only:<secret_id>'

              # The write-only prefix also works with the composite format.
              terraform import infisical_secret.example 'write-only:<workspace_id>:<env_slug>:<folder_path>:<secret_name>'
    infisical_secret_approval_policy:
        subCategory: Approval
        description: Create secret approval policy for your projects
        name: infisical_secret_approval_policy
        title: infisical_secret_approval_policy Resource - terraform-provider-infisical
        examples:
            - name: prod-policy
              manifest: |-
                {
                  "approvers": [
                    {
                      "id": "52c70c28-9504-4b88-b5af-ca2495dd277d",
                      "type": "group"
                    },
                    {
                      "type": "user",
                      "username": "name@infisical.com"
                    }
                  ],
                  "bypass_approvals_for_machine_identities": false,
                  "enforcement_level": "hard",
                  "environment_slugs": [
                    "prod"
                  ],
                  "name": "my-prod-policy",
                  "project_id": "${infisical_project.example.id}",
                  "required_approvals": 1,
                  "secret_path": "/"
                }
              references:
                project_id: infisical_project.example.id
              dependencies:
                infisical_project.example: |-
                    {
                      "name": "example",
                      "slug": "example"
                    }
        argumentDocs:
            allow_self_approval: (Boolean) Whether to allow the  approvers to approve their own changes
            approvers: (Attributes Set) The required approvers (see below for nested schema)
            bypass_approvals_for_machine_identities: '(Boolean) Whether machine identities can bypass the approval policy. If omitted when the policy is created, it defaults to false. Removing this attribute later does not reset it: for example, if it is set to true and you then delete it from your configuration, the policy keeps true. To disable it, set it to false explicitly.'
            bypassers: (Attributes Set) The bypassers who can bypass the approval policy (see below for nested schema)
            enforcement_level: (String) The enforcement level of the policy. This can either be hard or soft
            environment_slug: (String) (DEPRECATED, Use environment_slugs instead) The environment to apply the secret approval policy to
            environment_slugs: (List of String) The environments to apply the secret approval policy to
            id: (String) The ID of the secret approval policy
            name: (String) The name of the secret approval policy
            project_id: (String) The ID of the project to add the secret approval policy
            required_approvals: (Number) The number of required approvers
            secret_path: (String) The secret path to apply the secret approval policy to
            type: (String) The type of approver. Either group or user
            username: (String) The username of the approver. By default, this is the email
        importStatements: []
