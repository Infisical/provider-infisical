    infisical_secret_validation_rule_dynamic_secrets:
        subCategory: Secret Validation Rules
        description: Create and manage Secret Validation Rules for Dynamic Secrets
        name: infisical_secret_validation_rule_dynamic_secrets
        title: infisical_secret_validation_rule_dynamic_secrets Resource - terraform-provider-infisical
        examples:
            - name: dynamic-secrets
              manifest: |-
                {
                  "constraints": {
                    "password_constraints": {
                      "max_length": 64,
                      "min_length": 24
                    },
                    "providers": [
                      "sql-database"
                    ]
                  },
                  "environment": "dev",
                  "name": "dynamic-secrets-validation-rule-example",
                  "project_id": "\u003cproject-id\u003e",
                  "secret_path": "/**"
                }
        argumentDocs:
            constraints: (Attributes) The constraints this Dynamic Secrets rule enforces. (see below for nested schema)
            description: (String) An optional description of the secret validation rule.
            environment: (String) The slug of the environment to scope this rule to. Omit to enforce the rule in every environment of the project.
            id: (String) The ID of the secret validation rule.
            is_active: (Boolean) Whether the rule is enforced. An inactive rule is kept but ignored. Defaults to true.
            max_length: (Number) The maximum number of characters the generated password may contain.
            min_length: (Number) The minimum number of characters the generated password must contain.
            name: (String) The name of the secret validation rule.
            password_constraints: (Attributes) Constraints the generated password must satisfy. These replace any password requirements configured on the resource itself. (see below for nested schema)
            project_id: (String) The ID of the Infisical project to create the secret validation rule in.
            providers: '(Set of String) The dynamic secret providers this rule applies to. Supported: sql-database, milvus.'
            regex_pattern: (String) A regular expression the generated password must match. Setting this makes Infisical build the password from the pattern and ignore the length constraints on the same rule.
            required_prefix: (String) A string the generated password must start with.
            required_suffix: (String) A string the generated password must end with.
            secret_path: (String) The secret path to scope this rule to. Supports glob patterns such as /apps/**.
        importStatements:
            - |-
              # This will import the dynamic secrets validation rule by its ID
              terraform import infisical_secret_validation_rule_dynamic_secrets.example <rule_id>
