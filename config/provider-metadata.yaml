            has_template_sourced_token_reviewer_jwt: (Boolean) Whether this identity holds a token reviewer JWT copied from an auth template. That JWT is write-only and reads back as empty, so this is the only sign it is there. It is kept after template_id is removed unless token_reviewer_jwt replaces it, or is set to "" to remove it.
            id: (String) The ID of the kubernetes auth
            identity_id: (String) The ID of the identity to attach the configuration onto.
            ip_address: (String)
            kubernetes_ca_certificate: (String) The PEM-encoded CA cert for the Kubernetes API server. This is used by the TLS client for secure communication with the Kubernetes API server.
            kubernetes_host: (String) The host string, host:port pair, or URL to the base of the Kubernetes API server. This can usually be obtained by running kubectl cluster-info.
            template_id: '(String) The ID of an infisical_identity_kubernetes_auth_template to take the Kubernetes connection settings from. When set, kubernetes_host, kubernetes_ca_certificate, token_reviewer_jwt, token_reviewer_mode, gateway_id and allowed_audience come from the template and must not be set here, and later edits to the template propagate to this identity. Removing it unlinks the template and applies the settings in this configuration instead: a connection setting the configuration leaves out is cleared, and the plan shows it. To unlink and keep the template''s settings, set them here to the template''s values (for example from the infisical_identity_kubernetes_auth_template data source); an unlink that changes nothing else then only needs the unlink-templates permission on auth templates, or edit-auth on the identity. A token reviewer JWT copied from the template is kept unless token_reviewer_jwt is set to a new value, or to "" to remove it.'
            token_reviewer_jwt: (String) A long-lived service account JWT token for Infisical to access the TokenReview API to validate other service account JWT tokens submitted by applications/pods. This is the JWT token obtained from step 1.5.
            token_reviewer_mode: (String) Choose between Token ('api') or 'gateway' authentication. If using Gateway, the Gateway must be deployed in your Kubernetes cluster. Defaults to api, or to the linked template's mode when template_id is set.
        importStatements:
            - |-
              # This will import the resource by its identity ID
              terraform import infisical_identity_kubernetes_auth.example <identity_id>
    infisical_identity_kubernetes_auth_template:
        subCategory: Identities
        description: Create and manage a Kubernetes auth template in Infisical. A template holds the Kubernetes connection settings once, so many machine identities can share them by setting template_id on infisical_identity_kubernetes_auth. Editing a template propagates its settings to every identity linked to it. Auth templates are an Enterprise feature, and only Machine Identity authentication is supported for this resource.
        name: infisical_identity_kubernetes_auth_template
        title: infisical_identity_kubernetes_auth_template Resource - terraform-provider-infisical
        examples:
            - name: api
              manifest: |-
                {
                  "allowed_audience": "infisical",
                  "kubernetes_ca_certificate": "${file(\"\u003cpath-to-kubernetes-ca-certificate\u003e\")}",
                  "kubernetes_host": "https://\u003cyour-kubernetes-host\u003e:6443",
                  "name": "prod-cluster",
                  "token_reviewer_jwt": "ey\u003cexample\u003e"
                }
              dependencies:
                infisical_identity.machine-identity-demo: |-
                    {
                      "name": "machine-identity-demo",
                      "org_id": "\u003cyour-org-id\u003e",
                      "role": "admin"
                    }
                infisical_identity_kubernetes_auth.kubernetes-auth-demo: |-
                    {
                      "allowed_namespaces": [
                        "infisical-ns"
                      ],
                      "allowed_service_account_names": [
                        "infisical-sa"
                      ],
                      "identity_id": "${infisical_identity.machine-identity-demo.id}",
                      "template_id": "${infisical_identity_kubernetes_auth_template.api.id}"
                    }
            - name: gateway
              manifest: |-
                {
                  "gateway_id": "\u003cyour-gateway-id\u003e",
                  "name": "private-cluster",
                  "token_reviewer_mode": "gateway"
                }
              dependencies:
                infisical_identity.machine-identity-demo: |-
                    {
                      "name": "machine-identity-demo",
                      "org_id": "\u003cyour-org-id\u003e",
                      "role": "admin"
                    }
                infisical_identity_kubernetes_auth.kubernetes-auth-demo: |-
                    {
                      "allowed_namespaces": [
                        "infisical-ns"
                      ],
                      "allowed_service_account_names": [
                        "infisical-sa"
                      ],
                      "identity_id": "${infisical_identity.machine-identity-demo.id}",
                      "template_id": "${infisical_identity_kubernetes_auth_template.api.id}"
                    }
        argumentDocs:
            allowed_audience: (String) The audience claim that service account JWTs must carry to authenticate. Leave empty to skip the audience check.
            gateway_id: (String) The ID of the gateway to route Kubernetes API requests through. Mutually exclusive with gateway_pool_id.
            gateway_pool_id: (String) The ID of the gateway pool to route Kubernetes API requests through. Mutually exclusive with gateway_id.
            has_token_reviewer_jwt: (Boolean) Whether Infisical holds a token reviewer JWT for this template. The JWT itself is never returned, so this is the only way to tell a stored one apart from none.
            id: (String) The ID of the auth template.
            kubernetes_ca_certificate: (String) The PEM-encoded CA certificate used to validate the Kubernetes API server's TLS certificate. Must be omitted when token_reviewer_mode is gateway.
            kubernetes_host: (String) The host string, host:port pair, or URL to the base of the Kubernetes API server. Required when token_reviewer_mode is api, and must be omitted when it is gateway.
            name: (String) The name of the auth template, at most 64 characters.
            token_reviewer_jwt: '(String, Sensitive) A long-lived service account JWT that Infisical uses to call the TokenReview API. If omitted, each identity''s own service account token reviews itself. Must be omitted when token_reviewer_mode is gateway. Write-only: Infisical never returns it, so Terraform cannot detect a change made outside this configuration, and an imported template leaves it empty.'
            token_reviewer_mode: (String) Who performs the TokenReview. api means Infisical calls kubernetes_host directly. gateway means the TokenReview runs through gateway_id or gateway_pool_id. Defaults to api.
            verify_tls_certificate: (Boolean) Whether to verify the Kubernetes API server's TLS certificate against kubernetes_ca_certificate. Defaults to true when a CA certificate is set, and false otherwise. In api mode, true requires a CA certificate and false forbids one. In gateway mode it cannot be true.
        importStatements:
            - |-
              terraform import infisical_identity_kubernetes_auth_template.example <template_id>

              # token_reviewer_jwt is write-only, so an imported template has it empty. has_token_reviewer_jwt
              # still reports whether Infisical holds one.
