    infisical_cert_manager_application_group:
        subCategory: Certificate Management
        description: Manage group memberships for a Certificate Manager application in Infisical. Only Machine Identity authentication is supported for this resource.
        name: infisical_cert_manager_application_group
        title: infisical_cert_manager_application_group Resource - terraform-provider-infisical
        examples:
            - name: platform_sre_admins
              manifest: |-
                {
                  "application_id": "${infisical_cert_manager_application.platform.id}",
                  "group_id": "${infisical_cert_manager_group.sre.group_id}",
                  "role": "admin"
                }
              references:
                application_id: infisical_cert_manager_application.platform.id
                group_id: infisical_cert_manager_group.sre.group_id
              dependencies:
                infisical_cert_manager_application.platform: |-
