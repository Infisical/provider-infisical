    infisical_project_identity:
        subCategory: Projects
        description: Assign an existing organization-level machine identity to a project & save to Infisical. This resource does not create a new identity; it manages the project membership and role(s) of an identity that already exists at the organization level. To create an identity that lives inside a single project, use the infisical_project_scoped_identity resource instead. Only Machine Identity authentication is supported for this resource.
        name: infisical_project_identity
        title: infisical_project_identity Resource - terraform-provider-infisical
        examples:
            - name: test-identity
              manifest: |-
                {
                  "identity_id": "\u003cidentity id\u003e",
                  "project_id": "${infisical_project.example.id}",
                  "roles": [
                    {
                      "role_slug": "admin"
                    }
                  ]
                }
              references:
                project_id: infisical_project.example.id
              dependencies:
                infisical_project.example: |-
                    {
                      "name": "example",
                      "slug": "example"
                    }
            - name: creator-identity
              manifest: |-
                {
                  "adopt_existing": true,
                  "identity_id": "\u003ccreator-identity-id\u003e",
                  "project_id": "${infisical_project.example.id}",
                  "roles": [
                    {
                      "role_slug": "admin"
                    }
                  ]
                }
              references:
                project_id: infisical_project.example.id
              dependencies:
                infisical_project.example: |-
                    {
                      "name": "example",
                      "slug": "example"
                    }
        argumentDocs:
            adopt_existing: (Boolean) When true, if the identity is already a member of the project (e.g. auto-added by Infisical when the project was created by this identity), the existing membership is adopted and its roles are updated to match the desired state instead of returning an error. Defaults to false.
            auth_methods: (List of String) The auth methods for the identity
            custom_role_id: (String) The id of the custom role slug
            id: (String) The ID of the project identity role.
            identity: (Attributes) The identity details of the project identity (see below for nested schema)
            identity_id: (String) The id of the identity.
            is_temporary: (Boolean) Flag to indicate the assigned role is temporary or not. When is_temporary is true fields temporary_mode, temporary_range and temporary_access_start_time is required.
            membership_id: (String) The membership Id of the project identity
            name: (String) The name of the identity
            project_id: (String) The id of the project
            role_slug: (String) The slug of the role
            roles: (Attributes List) The roles assigned to the project identity (see below for nested schema)
            temporary_access_end_time: (String) ISO time for which temporary access will end. Computed based on temporary_range and temporary_access_start_time
            temporary_access_start_time: (String) ISO time for which temporary access should begin. The current time is used by default.
            temporary_mode: '(String) Type of temporary access given. Types: relative. Default: relative'
            temporary_range: '(String) TTL for the temporary time. Eg: 1m, 1h, 1d. Default: 1h'
        importStatements: []
    infisical_project_identity_specific_privilege:
