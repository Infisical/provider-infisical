            oidc_ca_certificate: (String) The PEM-encoded CA cert for establishing secure communication with the Identity Provider endpoints
            oidc_discovery_url: (String) The URL used to retrieve the OpenID Connect configuration from the identity provider. Required unless template_id is set.
            template_id: '(String) The ID of an infisical_identity_oidc_auth_template to take the identity provider settings from. When set, oidc_discovery_url, bound_issuer, bound_audiences and oidc_ca_certificate come from the template and must not be set here, later edits to the template propagate to this identity, and bound_subject or bound_claims must restrict which workloads can authenticate. Removing it unlinks the template and applies the settings in this configuration instead: bound_audiences and oidc_ca_certificate are cleared when the configuration leaves them out, and the plan shows it. To unlink and keep the template''s settings, set them here to the template''s values (for example from the infisical_identity_oidc_auth_template data source); an unlink that changes nothing else then only needs the unlink-templates permission on auth templates, or edit-auth on the identity.'
        importStatements: []
    infisical_identity_oidc_auth_template:
        subCategory: Identities
        description: Create and manage an OIDC auth template in Infisical. A template holds the identity provider settings once, so many machine identities can share them by setting template_id on infisical_identity_oidc_auth. Editing a template propagates its settings to every identity linked to it. Auth templates are an Enterprise feature, and only Machine Identity authentication is supported for this resource.
        name: infisical_identity_oidc_auth_template
        title: infisical_identity_oidc_auth_template Resource - terraform-provider-infisical
        examples:
            - name: github-actions
              manifest: |-
                {
                  "bound_audiences": [
                    "https://github.com/\u003cyour-org\u003e"
                  ],
                  "bound_issuer": "https://token.actions.githubusercontent.com",
                  "name": "github-actions",
                  "oidc_discovery_url": "https://token.actions.githubusercontent.com"
                }
              dependencies:
                infisical_identity.machine-identity-demo: |-
                    {
                      "name": "machine-identity-demo",
                      "org_id": "\u003cyour-org-id\u003e",
                      "role": "admin"
                    }
                infisical_identity_oidc_auth.oidc-auth-demo: |-
                    {
                      "bound_subject": "repo:\u003cyour-org\u003e/\u003cyour-repo\u003e:ref:refs/heads/main",
                      "identity_id": "${infisical_identity.machine-identity-demo.id}",
                      "template_id": "${infisical_identity_oidc_auth_template.github-actions.id}"
                    }
        argumentDocs:
            bound_audiences: (List of String) The intended recipients that OIDC tokens must carry in their aud claim. Leave empty to accept any audience.
            bound_issuer: (String) The unique identifier of the identity provider issuing the OIDC tokens.
            id: (String) The ID of the auth template.
            name: (String) The name of the auth template, at most 64 characters.
            oidc_ca_certificate: (String) The PEM-encoded CA certificate for establishing secure communication with the identity provider endpoints.
            oidc_discovery_url: (String) The URL used to retrieve the OpenID Connect configuration from the identity provider, without the /.well-known/openid-configuration suffix, which Infisical appends itself.
        importStatements:
            - terraform import infisical_identity_oidc_auth_template.example <template_id>
    infisical_identity_tls_cert_auth:
        subCategory: Identities
        description: Create and manage identity tls certificate auth in Infisical.
        name: infisical_identity_tls_cert_auth
        title: infisical_identity_tls_cert_auth Resource - terraform-provider-infisical
        examples:
            - name: tls-cert-auth
              manifest: |-
                {
