            province: (String) The state/province (ST) of the CA certificate
            status: '(String) The status of the CA. Supported values: active, disabled. Defaults to ''active''.'
            type: '(String) The type of the CA. Supported values: root, intermediate'
        importStatements:
            - |-
              # This will import the internal CA by its ID
              terraform import infisical_cert_manager_internal_ca.example <ca_id>
    infisical_cert_manager_user:
        subCategory: Certificate Management
        description: Manage user memberships in Certificate Manager. Only Machine Identity authentication is supported for this resource.
        name: infisical_cert_manager_user
        title: infisical_cert_manager_user Resource - terraform-provider-infisical
        examples:
            - name: admin
              manifest: |-
                {
                  "email": "admin@example.com",
                  "role": "admin"
                }
            - name: oncall
              manifest: |-
                {
                  "email": "oncall@example.com",
                  "role": "member"
                }
        argumentDocs:
            email: (String) The email of the user
            id: (String) The ID of the Certificate Manager user membership
            role: (String) The role to assign to the user (admin or member)
            user_id: (String) The ID of the user
        importStatements:
            - |-
              # This will import the Certificate Manager user membership by email
              terraform import infisical_cert_manager_user.example <email>
    infisical_certificate_sync_aws_certificate_manager:
        subCategory: Certificate Syncs
        description: Create and manage AWS Certificate Manager certificate syncs
        name: infisical_certificate_sync_aws_certificate_manager
        title: infisical_certificate_sync_aws_certificate_manager Resource - terraform-provider-infisical
        examples:
            - name: example
              manifest: |-
                {
                  "application_id": "\u003ccert-manager-application-id\u003e",
                  "connection_id": "\u003capp-connection-id\u003e",
                  "description": "Demo of AWS Certificate Manager certificate sync",
                  "destination_config": {
                    "aws_region": "\u003caws-region\u003e"
                  },
                  "name": "aws-certificate-manager-certificate-sync-demo",
                  "sync_options": {
                    "can_remove_certificates": true,
                    "certificate_name_schema": "Infisical-{{certificateId}}",
                    "include_root_ca": false,
                    "preserve_arn": true
                  }
                }
        argumentDocs:
            application_id: (String) The ID of the Certificate Manager application to create the sync in.
            auto_sync_enabled: (Boolean) Whether certificates should be automatically synced to the destination when they are added or renewed.
            aws_region: (String) The AWS region to sync certificates to (e.g. us-east-1).
            can_remove_certificates: (Boolean) Whether Infisical should remove certificates from AWS Certificate Manager when they are no longer managed in Infisical.
            certificate_name_schema: '(String) The naming scheme for synced certificates. Must include the {{certificateId}} or {{shortCertificateId}} placeholder. Available placeholders: {{certificateId}}, {{shortCertificateId}}, {{profileId}}, {{applicationId}}, {{applicationName}}, {{commonName}}.'
            connection_id: (String) The ID of the aws Connection to use for syncing.
            description: (String) An optional description for the AWS Certificate Manager sync.
            destination_config: (Attributes) The destination configuration for the certificate sync. (see below for nested schema)
            id: (String) The ID of the AWS Certificate Manager certificate sync
            include_root_ca: (Boolean) Whether to include the root CA certificate in the synced certificate chain.
            name: (String) The name of the AWS Certificate Manager sync to create.
            preserve_arn: (Boolean) Whether to preserve the AWS Certificate Manager ARN when a certificate is renewed, reimporting into the existing certificate instead of creating a new one.
            sync_options: (Attributes) Parameters to modify how certificates are synced. (see below for nested schema)
        importStatements:
            - |-
              # This will import the AWS Certificate Manager certificate sync by its ID
              terraform import infisical_certificate_sync_aws_certificate_manager.example <certificate_sync_id>
    infisical_certificate_sync_certificate:
        subCategory: Certificate Syncs
        description: 'Attach a certificate to a certificate sync so it is synced to the destination. The certificate must belong to the same application as the certificate sync. Only a currently valid certificate can be synced: certificates that have been renewed, revoked, or expired are rejected. Because Infisical attaches the renewed certificate and drops the superseded one when a certificate is renewed, pinning a literal certificate ID will break at the next renewal. Reference the resource that issues or renews the certificate instead so the ID stays in step automatically.'
        name: infisical_certificate_sync_certificate
        title: infisical_certificate_sync_certificate Resource - terraform-provider-infisical
        examples:
            - name: example
              manifest: |-
                {
                  "certificate_id": "${infisical_cert_manager_certificate.example.id}",
                  "certificate_sync_id": "${infisical_certificate_sync_aws_certificate_manager.example.id}"
                }
              references:
                certificate_id: infisical_cert_manager_certificate.example.id
                certificate_sync_id: infisical_certificate_sync_aws_certificate_manager.example.id
        argumentDocs:
            certificate_id: (String) The ID of the certificate to associate with the certificate sync.
            certificate_sync_id: (String) The ID of the certificate sync to associate the certificate with.
            id: (String) The ID of the certificate association.
        importStatements:
            - |-
              # This will import a certificate association using the composite ID "<certificate_sync_id>:<certificate_id>"
              terraform import infisical_certificate_sync_certificate.example <certificate_sync_id>:<certificate_id>
    infisical_dynamic_secret_aws_iam:
        subCategory: Dynamic Secrets
        description: Create and manage AWS IAM Dynamic Secret
        name: infisical_dynamic_secret_aws_iam
        title: infisical_dynamic_secret_aws_iam Resource - terraform-provider-infisical
        examples:
            - name: aws-iam
              manifest: |-
                {
                  "configuration": {
                    "access_key_config": {
                      "access_key": "YOUR_AWS_ACCESS_KEY_ID",
                      "secret_access_key": "YOUR_AWS_SECRET_ACCESS_KEY"
                    },
                    "aws_path": "/",
                    "method": "access_key",
                    "permission_boundary_policy_arn": "arn:aws:iam::123456789012:policy/YourBoundaryPolicy",
                    "policy_arns": "arn:aws:iam::aws:policy/ReadOnlyAccess,arn:aws:iam::123456789012:policy/SpecificPolicy",
                    "policy_document": "{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Action\": \"s3:ListBucket\",\n      \"Resource\": \"*\"\n    }\n  ]\n}\n",
                    "region": "us-east-1",
                    "user_groups": "group-a,group-b"
                  },
                  "default_ttl": "2h",
                  "environment_slug": "dev",
                  "max_ttl": "4h",
                  "name": "aws-iam-dynamic-secret-example",
                  "path": "/",
                  "project_slug": "your-project-slug",
                  "username_template": "{{randomUsername}}"
                }
        argumentDocs:
            access_key: (String) The managing AWS IAM User Access Key
            access_key_config: (Attributes) Configuration for the 'access_key' authentication method. (see below for nested schema)
            assume_role_config: (Attributes) Configuration for the 'assume_role' authentication method. (see below for nested schema)
            aws_path: (String) IAM AWS Path to scope created IAM User resource access.
            configuration: (Attributes) The configuration of the dynamic secret (see below for nested schema)
            default_ttl: (String) The default TTL that will be applied for all the leases.
            environment_slug: (String) The slug of the environment to create the dynamic secret in.
            id: (String) The ID of the dynamic secret.
            key: (String) The key of the metadata object
            max_ttl: (String) The maximum limit a TTL can be leased or renewed for.
            metadata: (Attributes Set) The metadata associated with this dynamic secret (see below for nested schema)
            method: (String) The authentication method to use. Must be 'access_key' or 'assume_role'.
            name: (String) The name of the dynamic secret.
            path: (String) The path to create the dynamic secret in.
            permission_boundary_policy_arn: (String) The IAM Policy ARN of the AWS Permissions Boundary to attach to IAM users created in the role.
            policy_arns: (String) The AWS IAM managed policies that should be attached to the created users. Multiple values can be provided by separating them with commas
            policy_document: (String) The AWS IAM inline policy that should be attached to the created users. Multiple values can be provided by separating them with commas
            project_slug: (String) The slug of the project to create dynamic secret in.
            region: (String) The AWS data center region.
            role_arn: (String) The ARN of the AWS Role to assume.
            secret_access_key: (String, Sensitive) The managing AWS IAM User Secret Key
            user_groups: (String) The AWS IAM groups that should be assigned to the created users. Multiple values can be provided by separating them with commas
            username_template: (String) The username template of the dynamic secret
            value: (String) The value of the metadata object
        importStatements: []
    infisical_dynamic_secret_kubernetes:
        subCategory: Dynamic Secrets
        description: Create and manage Kubernetes Dynamic Secret
        name: infisical_dynamic_secret_kubernetes
        title: infisical_dynamic_secret_kubernetes Resource - terraform-provider-infisical
        examples:
            - name: kubernetes
              manifest: |-
                {
                  "configuration": {
                    "api_config": {
                      "ca": "",
                      "cluster_token": "\u003ctoken\u003e",
                      "cluster_url": "https://example.com",
                      "enable_ssl": false
                    },
                    "audiences": [],
                    "auth_method": "api",
                    "credential_type": "static",
                    "static_config": {
                      "namespace": "default",
                      "service_account_name": "test-account"
                    }
                  },
                  "default_ttl": "1h",
                  "environment_slug": "dev",
                  "max_ttl": "4h",
                  "name": "kubernetes-dynamic-secret-example",
                  "path": "/",
                  "project_slug": "your-project-slug",
                  "username_template": "{{randomUsername}}"
                }
        argumentDocs:
            allowed_namespaces: (String) Kubernetes namespace(s) where the service accounts will be created. You can specify multiple namespaces as a comma-separated list (e.g., “default,kube-system”). During lease creation, you can specify which namespace to use from this allowed list.
            api_config: (Attributes) Configuration for the 'api' authentication method. (see below for nested schema)
            audiences: (List of String) Optional list of audiences to include in the generated token.
            auth_method: (String) Choose between Token ('api') or 'gateway' authentication. If using Gateway, the Gateway must be deployed in your Kubernetes cluster.
            ca: (String) Custom CA certificate for the Kubernetes API server. Leave blank to use the system/public CA.
            cluster_token: (String, Sensitive) Service account token with permissions to create service accounts and manage RBAC.
            cluster_url: (String) Kubernetes API server URL (e.g., https://kubernetes.default.svc).
            configuration: (Attributes) The configuration of the dynamic secret (see below for nested schema)
            credential_type: (String) Choose between 'static' (predefined service account) or 'dynamic' (temporary service accounts with role assignments).
            default_ttl: (String) The default TTL that will be applied for all the leases.
            dynamic_config: (Attributes) Configuration for the 'dynamic' credential type. (see below for nested schema)
            enable_ssl: (Boolean) Whether to enable SSL verification for the Kubernetes API server connection.
            environment_slug: (String) The slug of the environment to create the dynamic secret in.
            gateway_id: (String) Select a gateway for private cluster access. If not specified, the Internet Gateway will be used.
            id: (String) The ID of the dynamic secret.
            key: (String) The key of the metadata object
            max_ttl: (String) The maximum limit a TTL can be leased or renewed for.
            metadata: (Attributes Set) The metadata associated with this dynamic secret (see below for nested schema)
            name: (String) The name of the dynamic secret.
            namespace: (String) Kubernetes namespace where the service account exists.
            path: (String) The path to create the dynamic secret in.
            project_slug: (String) The slug of the project to create dynamic secret in.
            role: (String) Name of the role to assign to the temporary service account.
            role_type: (String) Type of role to assign ('cluster-role' or 'role').
            service_account_name: (String) Name of the service account to generate tokens for.
            static_config: (Attributes) Configuration for the 'static' credential type. (see below for nested schema)
            username_template: (String) The username template of the dynamic secret
            value: (String) The value of the metadata object
        importStatements: []
    infisical_dynamic_secret_mongo_atlas:
        subCategory: Dynamic Secrets
        description: Create and manage MongoDB Atlas Dynamic Secret
        name: infisical_dynamic_secret_mongo_atlas
        title: infisical_dynamic_secret_mongo_atlas Resource - terraform-provider-infisical
        examples:
            - name: mongo-atlas
              manifest: |-
                {
                  "configuration": {
                    "admin_private_key": "your-admin-private-key",
                    "admin_public_key": "your-admin-public-key",
                    "group_id": "your-group-id",
                    "roles": [
                      {
                        "database_name": "my-application-db",
                        "role_name": "readWrite"
                      }
                    ],
                    "scopes": [
                      {
                        "name": "myCluster",
                        "type": "CLUSTER"
                      }
                    ]
                  },
                  "default_ttl": "1h",
                  "environment_slug": "dev",
                  "max_ttl": "4h",
                  "name": "mongo-atlas-dynamic-secret-example",
                  "path": "/",
                  "project_slug": "your-project-slug",
                  "username_template": "{{randomUsername}}"
                }
        argumentDocs:
            admin_private_key: (String, Sensitive) Admin user private API key. This value is stored in the Terraform state; use admin_private_key_wo to keep it out of state. Exactly one of admin_private_key or admin_private_key_wo must be set.
            admin_private_key_wo: (String, Sensitive) Admin user private API key (write-only). This value is never stored in the Terraform state and can accept ephemeral values. Because it is not stored, changes to it are not detected; increment admin_private_key_wo_version to push a new value. Requires Terraform 1.11+.
            admin_private_key_wo_version: (Number) The version of the admin_private_key_wo value. Increment this to trigger an update of the private key.
            admin_public_key: (String) Admin user public API key
            collection_name: (String) Collection on which this role applies.
            configuration: (Attributes) The configuration of the dynamic secret (see below for nested schema)
            database_name: (String) Database to which the user is granted access privileges.
            default_ttl: (String) The default TTL that will be applied for all the leases.
            environment_slug: (String) The slug of the environment to create the dynamic secret in.
            group_id: (String) Unique 24-hexadecimal digit string that identifies your project. This is the same as the project ID.
            id: (String) The ID of the dynamic secret.
            key: (String) The key of the metadata object
            max_ttl: (String) The maximum limit a TTL can be leased or renewed for.
            metadata: (Attributes Set) The metadata associated with this dynamic secret (see below for nested schema)
            name: (String) The name of the dynamic secret.
            path: (String) The path to create the dynamic secret in.
            project_slug: (String) The slug of the project to create dynamic secret in.
            role_name: (String) Human-readable label that identifies a group of privileges assigned to a database user. This value can either be a built-in role or a custom role.
            roles: (Attributes List) (see below for nested schema)
            scopes: (Attributes List) (see below for nested schema)
            type: '(String) Category of resource that this database user can access. Supported options: CLUSTER, DATA_LAKE, STREAM'
            username_template: (String) The username template of the dynamic secret
            value: (String) The value of the metadata object
        importStatements: []
    infisical_dynamic_secret_mongo_db:
        subCategory: Dynamic Secrets
        description: Create and manage MongoDB Dynamic Secret
        name: infisical_dynamic_secret_mongo_db
        title: infisical_dynamic_secret_mongo_db Resource - terraform-provider-infisical
        examples:
            - name: mongo-db
              manifest: |-
                {
                  "configuration": {
                    "database": "default",
                    "host": "your-host",
                    "password": "your-password",
                    "port": 27017,
                    "roles": [
                      "readWrite"
                    ],
                    "username": "your-username"
                  },
                  "default_ttl": "1h",
                  "environment_slug": "dev",
                  "max_ttl": "24h",
                  "name": "mongo-db-dynamic-secret-example",
                  "path": "/",
                  "project_slug": "your-project-slug",
                  "username_template": "{{randomUsername}}"
                }
        argumentDocs:
            ca: (String) The CA certificate to use to connect to the database.
            configuration: (Attributes) The configuration of the dynamic secret (see below for nested schema)
            database: (String) The name of the database to use.
            default_ttl: (String) The default TTL that will be applied for all the leases.
            environment_slug: (String) The slug of the environment to create the dynamic secret in.
            host: (String) The host of the database server.
            id: (String) The ID of the dynamic secret.
            key: (String) The key of the metadata object
            max_ttl: (String) The maximum limit a TTL can be leased or renewed for.
            metadata: (Attributes Set) The metadata associated with this dynamic secret (see below for nested schema)
            name: (String) The name of the dynamic secret.
            password: (String, Sensitive) The password to use to connect to the database.
            path: (String) The path to create the dynamic secret in.
            port: (Number) The port of the database server.
            project_slug: (String) The slug of the project to create dynamic secret in.
            roles: (List of String) A list of role names to assign to the user. The role names can either be built-in or custom.
            username: (String) The username to use to connect to the database.
            username_template: (String) The username template of the dynamic secret
            value: (String) The value of the metadata object
        importStatements: []
    infisical_dynamic_secret_sql_database:
        subCategory: Dynamic Secrets
        description: Create and manage SQL Database Dynamic Secret
        name: infisical_dynamic_secret_sql_database
        title: infisical_dynamic_secret_sql_database Resource - terraform-provider-infisical
        examples:
            - name: sql-database
              manifest: |-
                {
                  "configuration": {
                    "client": "postgres",
                    "creation_statement": "CREATE USER \"{{username}}\" WITH ENCRYPTED PASSWORD '{{password}}' VALID UNTIL '{{expiration}}';\nGRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO \"{{username}}\";\n",
                    "database": "infisical",
                    "host": "host.docker.internal",
                    "password": "infisical",
                    "password_requirements": {
                      "allowed_symbols": "!@#$%^\u0026*()_+-=[]{}|:,.\u003c\u003e?`~",
                      "length": 32,
                      "required": {
                        "digits": 3,
                        "lowercase": 2,
                        "symbols": 2,
                        "uppercase": 2
                      }
                    },
                    "port": "5431",
                    "renew_statement": "ALTER ROLE \"{{username}}\" VALID UNTIL \"{{expiration}}\";\n",
                    "revocation_statement": "REVOKE ALL PRIVILEGES ON ALL TABLES IN SCHEMA public FROM \"{{username}}\";\nDROP ROLE \"{{username}}\";\n",
                    "username": "infisical"
                  },
                  "default_ttl": "2h",
                  "environment_slug": "prod",
                  "max_ttl": "4h",
                  "name": "postgres-dynamic-secret",
                  "path": "/",
                  "project_slug": "project-7-new-c7-vv",
                  "username_template": "{{randomUsername}}"
                }
        argumentDocs:
            allowed_symbols: (String) The symbols allowed in the password.
            ca: (String) The CA certificate to use to connect to the database.
            client: (String) The database client to use. Currently supported values are postgres, mysql2, oracledb, mssql, sap-ase, and vertica.
            configuration: (Attributes) The configuration of the dynamic secret (see below for nested schema)
            creation_statement: (String) The creation statement to use to create the dynamic secret lease.
            database: (String) The name of the database to use.
            default_ttl: (String) The default TTL that will be applied for all the leases.
            digits: (Number) The number of digits required in the password.
            environment_slug: (String) The slug of the environment to create the dynamic secret in.
            gateway_id: (String) The Gateway ID to use to connect to the database.
            host: (String) The host of the database server.
            id: (String) The ID of the dynamic secret.
            key: (String) The key of the metadata object
            length: (Number) The length of the password to use to create the dynamic secret lease.
            lowercase: (Number) The number of lowercase characters required in the password.
            max_ttl: (String) The maximum limit a TTL can be leased or renewed for.
            metadata: (Attributes Set) The metadata associated with this dynamic secret (see below for nested schema)
            name: (String) The name of the dynamic secret.
            password: (String, Sensitive) The password to use to connect to the database. This value is stored in the Terraform state; use password_wo to keep it out of state. Exactly one of password or password_wo must be set.
            password_requirements: (Attributes) The password requirements to use to create the dynamic secret lease. (see below for nested schema)
            password_wo: (String, Sensitive) The password to use to connect to the database (write-only). This value is never stored in the Terraform state and can accept ephemeral values. Because it is not stored, changes to it are not detected; increment password_wo_version to push a new value. Requires Terraform 1.11+.
            password_wo_version: (Number) The version of the password_wo value. Increment this to trigger an update of the password.
            path: (String) The path to create the dynamic secret in.
            port: (Number) The port of the database server.
            project_slug: (String) The slug of the project to create dynamic secret in.
            renew_statement: (String) The renew statement to use to renew the dynamic secret lease.
            required: (Attributes) The required characters to use to create the dynamic secret lease. (see below for nested schema)
            revocation_statement: (String) The revocation statement to use to revoke the dynamic secret lease.
            symbols: (Number) The number of symbols required in the password.
            uppercase: (Number) The number of uppercase characters required in the password.
            username: (String) The username to use to connect to the database.
            username_template: (String) The username template of the dynamic secret
            value: (String) The value of the metadata object
        importStatements: []
    infisical_external_kms_aws:
        subCategory: External KMS
        description: Create and manage AWS External KMS
        name: infisical_external_kms_aws
        title: infisical_external_kms_aws Resource - terraform-provider-infisical
        examples:
            - name: external-kms-aws-assume-role
              manifest: |-
                {
                  "configuration": {
                    "aws_kms_key_id": "\u003caws-kms-key-id\u003e",
                    "aws_region": "us-east-1",
                    "credential": {
                      "role_arn": "\u003cassume-role-arn\u003e",
                      "role_external_id": "\u003crole-external-id\u003e"
                    },
                    "type": "assume-role"
                  },
                  "description": "AWS External KMS using assume-role type",
                  "name": "aws-assume-role-external-kms"
                }
            - name: external-kms-aws-access-key
              manifest: |-
                {
                  "configuration": {
                    "aws_kms_key_id": "\u003caws-kms-key-id\u003e",
                    "aws_region": "us-east-1",
                    "credential": {
                      "access_key_id": "\u003caccess-key-id\u003e",
                      "secret_access_key": "\u003csecret-access-key\u003e"
                    },
                    "type": "access-key"
                  },
                  "description": "AWS External KMS using access-key type",
                  "name": "aws-access-key-external-kms"
                }
        argumentDocs:
            access_key_id: (String, Sensitive) The AWS Access Key ID used to authenticate requests to AWS services. Required for access-key type. For more details, refer to the documentation here https://infisical.com/docs/documentation/platform/kms-configuration/aws-kms#param-access-key-id
            aws_kms_key_id: (String) The AWS KMS key ID to use for the external KMS. For more details, refer to the documentation here https://infisical.com/docs/documentation/platform/kms-configuration/aws-kms#param-aws-kms-key-id
            aws_region: (String) The AWS region where the KMS key is located
            configuration: (Attributes) The configuration for the AWS External KMS (see below for nested schema)
            credential: (Attributes) The AWS credentials for the external KMS (see below for nested schema)
            credentials_hash: (String) The hash of the AWS External KMS credentials
            description: (String) An optional description for the KMS.
            id: (String) The ID of the KMS
            name: (String) The name of the KMS to create. Must be slug-friendly
            role_arn: (String, Sensitive) The Amazon Resource Name (ARN) of the IAM role to assume for performing operations. Infisical will assume this role using AWS Security Token Service (STS). Required for assume-role type. For more details, refer to the documentation here https://infisical.com/docs/documentation/platform/kms-configuration/aws-kms#param-iam-role-arn-for-role-assumption
            role_external_id: (String, Sensitive) The external ID of the role to assume for performing operations. Required for assume-role type. For more details, refer to the documentation here https://infisical.com/docs/documentation/platform/kms-configuration/aws-kms#param-assume-role-external-id
            secret_access_key: (String, Sensitive) The AWS Secret Access Key associated with the Access Key ID to authenticate requests to AWS services. Required for access-key type. For more details, refer to the documentation here https://infisical.com/docs/documentation/platform/kms-configuration/aws-kms#param-secret-access-key
            type: (String) The Authentication Type to use. Must be access-key or assume-role
        importStatements: []
    infisical_gateway:
        subCategory: Gateways
        description: 'Create and manage a gateway in Infisical. This resource is the gateway''s record and its auth method, not the machine that runs it: deploy that separately with the Helm chart or the CLI, pointing it at this resource''s id. Exactly one auth method block must be set.'
        name: infisical_gateway
        title: infisical_gateway Resource - terraform-provider-infisical
        examples:
            - name: aws
              manifest: |-
                {
                  "aws_auth": {
                    "allowed_account_ids": [
                      "123456789012"
                    ],
                    "allowed_principal_arns": [
                      "arn:aws:iam::123456789012:role/infisical-gateway"
                    ]
                  },
                  "name": "prod-us-east"
                }
            - name: gcp
              manifest: |-
                {
                  "gcp_auth": {
                    "allowed_projects": [
                      "my-project"
                    ],
                    "allowed_service_accounts": [
                      "infisical-gateway@my-project.iam.gserviceaccount.com"
                    ],
                    "allowed_zones": [
                      "us-central1-a"
                    ],
                    "type": "gce"
                  },
                  "name": "prod-gce"
                }
            - name: gke
              manifest: |-
                {
                  "kubernetes_auth": {
                    "allowed_namespaces": [
                      "infisical"
                    ],
                    "allowed_service_account_names": [
                      "infisical-gateway"
                    ],
                    "ca_certificate": "${file(\"${path.module}/cluster-ca.crt\")}",
                    "kubernetes_host": "https://10.0.0.1",
                    "token_reviewer_jwt": "${var.token_reviewer_jwt}"
                  },
                  "name": "gke-prod"
                }
            - name: gke_second
              manifest: |-
                {
                  "kubernetes_auth": {
                    "allowed_namespaces": [
                      "infisical"
                    ],
                    "allowed_service_account_names": [
                      "infisical-gateway"
                    ],
                    "reviewer_gateway_id": "${infisical_gateway.gke.id}",
                    "token_review_mode": "gateway"
                  },
                  "name": "gke-prod-2"
                }
            - name: datacenter
              manifest: |-
                {
                  "name": "datacenter-01",
                  "token_auth": {}
                }
        argumentDocs:
            allowed_account_ids: (Set of String) AWS account IDs allowed to authenticate as this gateway.
            allowed_audience: (String) The audience the service account token must carry. Leave empty to skip the audience check.
            allowed_namespaces: (Set of String) Kubernetes namespaces whose service accounts are allowed to authenticate as this gateway. Supports * wildcards.
            allowed_principal_arns: (Set of String) IAM principal ARNs allowed to authenticate as this gateway. Supports * wildcards.
            allowed_projects: (Set of String) GCP project IDs whose Compute Engine instances are allowed to authenticate as this gateway. Only applies when type is gce.
            allowed_service_account_names: (Set of String) Kubernetes service account names allowed to authenticate as this gateway. Supports * wildcards.
            allowed_service_accounts: (Set of String) GCP service account emails allowed to authenticate as this gateway.
            allowed_zones: (Set of String) GCP zones whose Compute Engine instances are allowed to authenticate as this gateway. Only applies when type is gce.
            aws_auth: (Attributes) Authenticate the gateway with its AWS IAM identity. The machine re-authenticates on every start, so no secret is stored. At least one of allowed_principal_arns or allowed_account_ids must be non-empty. (see below for nested schema)
            ca_certificate: (String) The PEM-encoded CA certificate that issued the Kubernetes API server's TLS certificate.
            gcp_auth: (Attributes) Authenticate the gateway with its GCP identity. The machine re-authenticates on every start, so no secret is stored. At least one of allowed_service_accounts or allowed_projects must be non-empty. (see below for nested schema)
            has_token_reviewer_jwt: (Boolean) Whether Infisical holds a token reviewer JWT for this gateway. The JWT itself is never returned, so this is the only way to tell a stored one apart from none.
            id: (String) The ID of the gateway.
            kubernetes_auth: (Attributes) Authenticate the gateway with its Kubernetes service account token. The pod re-authenticates on every start, so no secret is stored. At least one of allowed_namespaces or allowed_service_account_names must be non-empty. (see below for nested schema)
            kubernetes_host: (String) The URL of the Kubernetes API server, for example https://my-cluster.example.com:6443. Must be https with no path, and reachable from Infisical over the public internet. Required unless token_review_mode is gateway, where it must be omitted.
            name: (String) The name of the gateway. Unique within the organization. Renaming is an in-place update, so the gateway keeps its ID and anything referencing it keeps working.
            reviewer_gateway_id: (String) The gateway that performs the TokenReview. Required when token_review_mode is gateway, and must be a different gateway that is already connected in the cluster. Mutually exclusive with reviewer_gateway_pool_id.
            reviewer_gateway_pool_id: (String) The gateway pool to route TokenReview traffic through. Mutually exclusive with reviewer_gateway_id, and rejected when token_review_mode is gateway.
            token_auth: '(Attributes) Authenticate the gateway with a one-time enrollment token. The token itself is minted by a separate infisical_gateway_enrollment_token resource. This block takes no arguments, because token auth has nothing to configure: write token_auth = {}. Prefer aws_auth, gcp_auth or kubernetes_auth where the platform can vouch for the machine, since those re-authenticate on every start and put no secret in state. (see below for nested schema)'
            token_review_mode: (String) Who performs the TokenReview. api means Infisical does, calling kubernetes_host directly. gateway means another already-connected gateway does it with its own in-cluster service account, which needs no host or reviewer token. Defaults to api.
            token_reviewer_jwt: '(String, Sensitive) A long-lived service account token with the system:auth-delegator ClusterRole, used to submit TokenReview requests. Write-only: Infisical never returns it, so Terraform cannot detect a change made outside this configuration, and an imported gateway leaves it empty.'
            type: (String) How the gateway proves its identity. gce verifies an ID token from the instance metadata server, which covers Compute Engine VMs and GKE workload identity. iam verifies a JWT the service account signed through the IAM Credentials API, for hosts outside Compute Engine. Defaults to gce.
            verify_tls_certificate: (Boolean) Whether to verify the Kubernetes API server's TLS certificate. Defaults to true.
        importStatements:
            - |-
              terraform import infisical_gateway.example <gateway_id>

              # token_reviewer_jwt is write-only, so an imported Kubernetes gateway has it empty.
              # Gateways bound to a machine identity predate auth methods and cannot be imported.
    infisical_gateway_enrollment_token:
        subCategory: Gateways
        description: Mint the one-time enrollment token a token-auth gateway uses to bootstrap. The token is single-use and expires an hour after it is issued, and minting a new one invalidates any token issued earlier for the same gateway. Use keepers to tie re-minting to whatever forces the machine that consumes the token to be rebuilt. Where the platform can vouch for the machine, prefer aws_auth, gcp_auth or kubernetes_auth on the gateway instead, since those re-authenticate on every start and need none of this.
        name: infisical_gateway_enrollment_token
        title: infisical_gateway_enrollment_token Resource - terraform-provider-infisical
        examples:
            - name: datacenter
              manifest: |-
                {
                  "gateway_id": "${infisical_gateway.datacenter.id}",
                  "keepers": {
                    "ami_id": "${data.aws_ami.ubuntu.id}",
                    "subnet_id": "${var.subnet_id}"
                  }
                }
              references:
                gateway_id: infisical_gateway.datacenter.id
              dependencies:
                infisical_gateway.datacenter: |-
                    {
                      "name": "datacenter-01",
                      "token_auth": {}
                    }
        argumentDocs:
            expires_at: (String) When the token expires. A token that has already been used is invalid before this.
            gateway_id: (String) The ID of the gateway to mint the token for. The gateway must be configured with token_auth.
            id: (String) The ID of the gateway the token was minted for. An enrollment token has no identifier of its own, because a gateway holds at most one at a time.
            keepers: (Map of String) Arbitrary values that force a new token when any of them changes. List whatever forces the machine that consumes the token to be rebuilt, for example the AMI ID and subnet of an EC2 instance. Nothing validates this list, so an input you leave out means the rebuilt machine boots with a token that was already consumed, stays offline, and shows no drift.
            token: (String, Sensitive) The enrollment token. Single-use, valid for one hour, and stored in Terraform state in plaintext.
        importStatements: []
