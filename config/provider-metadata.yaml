    infisical_project_scoped_identity:
        subCategory: Projects
        description: Create and manage a machine identity scoped to a single project in Infisical, including its project role(s). Project-scoped identities are bound to one project and cannot be assigned to other projects. Only Machine Identity authentication is supported for this resource.
        name: infisical_project_scoped_identity
        title: infisical_project_scoped_identity Resource - terraform-provider-infisical
        examples:
            - name: example
              manifest: |-
                {
                  "has_delete_protection": false,
                  "metadata": [
                    {
                      "key": "team",
                      "value": "backend"
                    },
                    {
                      "key": "environment",
                      "value": "production"
                    }
                  ],
                  "name": "my-project-identity",
                  "project_id": "${infisical_project.example.id}",
                  "roles": [
                    {
                      "role_slug": "admin"
                    }
                  ]
                }
              references:
                project_id: infisical_project.example.id
              dependencies:
                infisical_project.example: |-
                    {
                      "name": "example",
                      "slug": "example"
                    }
        argumentDocs:
            auth_methods: (List of String) The authentication methods configured for the identity.
            custom_role_id: (String) The id of the custom role. Read-only; reference custom roles via role_slug.
            has_delete_protection: (Boolean) Whether the identity has delete protection enabled. Defaults to false.
            id: (String) The ID of the project-scoped identity.
            is_temporary: (Boolean) Flag to indicate the assigned role is temporary or not. When is_temporary is true fields temporary_mode, temporary_range and temporary_access_start_time is required.
            key: (String) The key of the metadata entry.
            metadata: (Attributes Set) The metadata associated with this identity. (see below for nested schema)
            name: (String) The name of the identity.
            project_id: (String) The ID of the project that owns this identity.
            role_slug: (String) The slug of the role. To assign a custom role, set this to the custom role's slug.
            roles: (Attributes List) The roles assigned to the project-scoped identity. At least one permanent (non-temporary) role is required. (see below for nested schema)
            temporary_access_end_time: (String) ISO time for which temporary access will end. Computed based on temporary_range and temporary_access_start_time
            temporary_access_start_time: (String) ISO time for which temporary access should begin. The current time is used by default.
            temporary_mode: '(String) Type of temporary access given. Types: relative. Default: relative'
            temporary_range: '(String) TTL for the temporary time. Eg: 1m, 1h, 1d. Default: 1h'
            value: (String) The value of the metadata entry.
        importStatements:
            - |-
              # Import a project-scoped identity using <project_id>,<identity_id>
              terraform import infisical_project_scoped_identity.example <project_id>,<identity_id>
