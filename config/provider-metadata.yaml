    infisical_cert_manager_application_profile:
        subCategory: Certificate Management
        description: Attach a certificate profile to a Certificate Manager application and configure its enrollment methods. Each enrollment block (api_config, est_config, acme_config, scep_config) is optional; add, edit, or remove a block to update the matching enrollment. Only Machine Identity authentication is supported.
        name: infisical_cert_manager_application_profile
        title: infisical_cert_manager_application_profile Resource - terraform-provider-infisical
        examples:
            - name: platform_web_server
              manifest: |-
                {
                  "acme_config": {
                    "skip_dns_ownership_verification": false,
                    "skip_eab_binding": false
                  },
                  "api_config": {
                    "auto_renew": true,
                    "renew_before_days": 7
                  },
                  "application_id": "${infisical_cert_manager_application.platform.id}",
                  "est_config": {
                    "disable_bootstrap_ca_validation": false,
                    "passphrase": "change-me-est-secret"
                  },
                  "profile_id": "${infisical_cert_manager_certificate_profile.web_server.id}",
                  "scep_config": {
                    "allow_cert_based_renewal": true,
                    "challenge_password": "change-me-scep-secret",
                    "challenge_type": "static",
                    "include_ca_cert_in_response": true,
                    "sign_ra_with_ca": false
                  }
                }
              references:
                application_id: infisical_cert_manager_application.platform.id
                profile_id: infisical_cert_manager_certificate_profile.web_server.id
              dependencies:
                infisical_cert_manager_application.platform: |-
                    {
                      "name": "platform"
                    }
                infisical_cert_manager_certificate_policy.web_server: |-
                    {
                      "algorithms": [
                        {
                          "key_algorithm": [
                            "RSA-2048"
                          ],
                          "signature": [
                            "SHA256-RSA"
                          ]
                        }
                      ],
                      "extended_key_usages": [
                        {
                          "allowed": [
                            "server_auth"
                          ]
                        }
                      ],
                      "key_usages": [
                        {
                          "allowed": [
                            "digital_signature",
                            "key_encipherment"
                          ]
                        }
                      ],
                      "name": "web-server-policy",
                      "subject": [
                        {
                          "allowed": [
                            "*.example.com"
                          ],
                          "required": [
                            "*.example.com"
                          ],
                          "type": "common_name"
                        }
                      ],
                      "validity": [
                        {
                          "max": "90d"
                        }
                      ]
                    }
                infisical_cert_manager_certificate_profile.web_server: |-
                    {
                      "ca_id": "${infisical_cert_manager_internal_ca.issuing.id}",
                      "certificate_policy_id": "${infisical_cert_manager_certificate_policy.web_server.id}",
                      "defaults": [
                        {
                          "common_name": "service.example.com",
                          "extended_key_usages": [
                            "server_auth"
                          ],
                          "key_algorithm": "RSA_2048",
                          "key_usages": [
                            "digital_signature"
                          ],
                          "signature_algorithm": "RSA-SHA256",
                          "ttl_days": 90
                        }
                      ],
                      "issuer_type": "ca",
                      "name": "web-server"
                    }
                infisical_cert_manager_internal_ca.issuing: |-
                    {
                      "common_name": "Enterprise Issuing Certificate Authority",
                      "country": "US",
                      "key_algorithm": "RSA_2048",
                      "name": "enterprise-issuing-ca",
                      "organization": "Example Corp",
                      "type": "intermediate"
                    }
        argumentDocs:
            acme_config: (Attributes) Enable the ACME enrollment method. Omit the block to disable ACME enrollment. (see below for nested schema)
            allow_cert_based_renewal: (Boolean) Allow certificate-based renewal. Defaults to true.
            api_config: (Attributes) Enable the API enrollment method. Omit the block to disable API enrollment. (see below for nested schema)
            application_id: (String) The ID of the Certificate Manager application
            auto_renew: (Boolean) Whether to automatically renew certificates. Defaults to false when omitted.
            ca_chain: (String) PEM-encoded CA chain used for bootstrap CA validation (only honored when disable_bootstrap_ca_validation is false).
            challenge_endpoint_url: (String) The SCEP dynamic challenge endpoint URL (only set when challenge_type is dynamic).
            challenge_password: (String, Sensitive) Static-mode SCEP challenge password (min 8 chars). Required when challenge_type is static.
            challenge_type: '(String) SCEP challenge type. Supported values: static, dynamic. Defaults to static.'
            directory_url: (String) The ACME directory URL clients should use.
            disable_bootstrap_ca_validation: (Boolean) Whether to disable bootstrap CA validation. Defaults to false.
            dynamic_challenge_expiry_minutes: (Number) Expiry of a dynamic challenge in minutes (1-1440). Only used when challenge_type is dynamic.
            dynamic_challenge_max_pending: (Number) Maximum pending dynamic challenges (1-1000). Only used when challenge_type is dynamic.
            eab_kid: (String, Sensitive) External Account Binding key identifier. Populated on create and on import; routine refreshes don't re-fetch it. Rotated only by the explicit rotate endpoint, never by Terraform.
            eab_secret: (String, Sensitive) External Account Binding shared secret. Populated on create and on import; routine refreshes don't re-fetch it. Rotated only by the explicit rotate endpoint, never by Terraform.
            endpoint_url: (String) The EST endpoint URL clients should use.
            est_config: (Attributes) Enable the EST enrollment method. Omit the block to disable EST enrollment. (see below for nested schema)
            id: '(String) Composite identifier in the format :'
            include_ca_cert_in_response: (Boolean) Include the issuing CA certificate in SCEP responses. Defaults to true.
            passphrase: (String, Sensitive) EST passphrase used to authorize certificate requests.
            profile_id: (String) The ID of the certificate profile to attach
            ra_cert_expires_at: (String) ISO-8601 timestamp when the RA certificate expires.
            ra_certificate_pem: (String) The PEM-encoded RA certificate used by the SCEP service.
            renew_before_days: (Number) Number of days before expiration to renew (1-30). Defaults to 7 when omitted.
            scep_config: (Attributes) Enable the SCEP enrollment method. Omit the block to disable SCEP enrollment. (see below for nested schema)
            scep_endpoint_url: (String) The SCEP endpoint URL clients should use.
            sign_ra_with_ca: (Boolean) Sign the RA certificate with the profile's CA instead of self-signing it, so it chains to the CA root. Required by strict clients such as Apple and Microsoft Intune. Only supported for internal CAs. Cannot be changed once SCEP enrollment is configured. To change it, remove scep_config (or the whole resource) to disable SCEP enrollment in one apply, then add scep_config back with the new value in a subsequent apply. Defaults to false.
            skip_dns_ownership_verification: (Boolean) Skip DNS ownership verification. Defaults to false.
            skip_eab_binding: (Boolean) Skip External Account Binding. Defaults to false. Cannot be set to true at the same time as skip_dns_ownership_verification.
        importStatements:
            - |-
              # This will import the application-profile attachment by application ID and profile ID
              terraform import infisical_cert_manager_application_profile.example <application_id>:<profile_id>
