                }
              references:
                ca_id: infisical_cert_manager_internal_ca.issuing.id
                parent_ca_id: infisical_cert_manager_internal_ca.root.id
              dependencies:
                infisical_cert_manager_internal_ca.issuing: |-
                    {
                      "common_name": "Enterprise Issuing Certificate Authority",
                      "country": "US",
                      "key_algorithm": "RSA_2048",
                      "locality": "San Francisco",
                      "name": "enterprise-issuing-ca",
                      "organization": "Example Corp",
                      "ou": "IT Security",
                      "province": "California",
                      "type": "intermediate"
                    }
                infisical_cert_manager_internal_ca.root: |-
                    {
                      "common_name": "Enterprise Root Certificate Authority",
                      "country": "US",
                      "key_algorithm": "RSA_2048",
                      "locality": "San Francisco",
                      "name": "enterprise-root-ca",
                      "organization": "Example Corp",
                      "ou": "IT Security",
                      "province": "California",
                      "type": "root"
                    }
        argumentDocs:
            ca_id: (String) The ID of the certificate authority to generate a certificate for
            certificate: (String, Sensitive) The generated CA certificate in PEM format
            certificate_chain: (String, Sensitive) The certificate chain of the CA in PEM format
            id: (String) The unique identifier for this CA certificate resource
            max_path_length: (Number) The maximum number of intermediate CAs that may follow this CA in the certificate chain. Use -1 for no path limit
            not_after: (String) The date and time when the CA expires in RFC3339 format (e.g., '2034-01-01T00:00:00Z')
            not_before: (String) The date and time when the CA becomes valid in RFC3339 format (e.g., '2024-01-01T00:00:00Z')
            parent_ca_id: (String) The ID of the parent CA (required for intermediate CAs)
            serial_number: (String) The serial number of the CA certificate
        importStatements:
            - |-
              # This will import the CA certificate by CA ID and certificate ID
              terraform import infisical_cert_manager_ca_certificate.example <ca_id>:<cert_id>
    infisical_cert_manager_certificate:
        subCategory: Certificate Management
        description: Request and manage certificates from Infisical certificate profiles. Supports both CSR-based and direct field requests. The resource will poll until the certificate is issued or a timeout is reached. Only Machine Identity authentication is supported for this resource.
        name: infisical_cert_manager_certificate
        title: infisical_cert_manager_certificate Resource - terraform-provider-infisical
        examples:
            - name: api_direct
              manifest: |-
                {
                  "alt_names": [
                    "api.example.com",
                    "api-internal.example.com"
                  ],
                  "application_id": "${infisical_cert_manager_application.platform.id}",
                  "common_name": "api.example.com",
                  "country": "US",
                  "extended_key_usages": [
                    "server_auth"
                  ],
                  "key_algorithm": "RSA_2048",
                  "key_usages": [
                    "digital_signature",
                    "key_encipherment"
                  ],
                  "organization": "Example Corp",
                  "profile_id": "\u003cprofile-id\u003e",
                  "signature_algorithm": "RSA-SHA256",
                  "timeout_seconds": 300,
                  "ttl": "90d"
                }
              references:
                application_id: infisical_cert_manager_application.platform.id
              dependencies:
                infisical_cert_manager_application.platform: |-
                    {
                      "description": "Certificates issued for the platform team",
                      "name": "platform"
                    }
            - name: api_csr_file
              manifest: |-
                {
                  "application_id": "${infisical_cert_manager_application.platform.id}",
                  "csr": "${file(\"./my-certificate.csr\")}",
                  "profile_id": "\u003cprofile-id\u003e",
                  "timeout_seconds": 300,
                  "ttl": "90d"
                }
              references:
                application_id: infisical_cert_manager_application.platform.id
              dependencies:
                infisical_cert_manager_application.platform: |-
                    {
                      "description": "Certificates issued for the platform team",
                      "name": "platform"
                    }
            - name: api_csr_inline
              manifest: |-
                {
                  "csr": "-----BEGIN CERTIFICATE REQUEST-----\nMIICljCCAX4CAQAwGDEWMBQGA1UEAwwNaW5maXNpY2FsLmNvbTCCASIwDQYJKoZI\nhvcNAQEBBQADggEPADCCAQoCggEBAL7c6thewe78xVXyBQ0ZgmSjlkYCGeJgxot/\nQqB1+z3mlMr/tViy8UFBThO69i532ZgWyuJ24YWVeF67WBQPYXnkXlUMJKYGM6UA\nka6dOjCeSJHNXkxbLHI3yljvXP/Kn6w+WczeSuJXYNH5Uet9TtTEuXIqTgWjnAhD\nTAWqtyHPbtw3jVWy7xkSc/JuqVGha05snjPPmF9lkdoztG3gosN0TnwTGaQ382sr\ngiUBkkfdBK0eGmTwJlG9xLZMm3hDyAFz2/iw6GR57uvp/h9RDZVZcuisUQf2T8NZ\nCCVPTSGpfYxbQ4KviDghL2/GDY9NVudHSyeCCA0zOPZW9tg7hAECAwEAAaA5MDcG\nCSqGSIb3DQEJDjEqMCgwJgYDVR0RBB8wHYINaW5maXNpY2FsLmNvbYIMaW5maXNp\nY2FsLmVzMA0GCSqGSIb3DQEBCwUAA4IBAQBZy+AYPWeZVs+ZPP/9Zj0cl7BchwZV\nphEPIezIdKqDyLcyjCf168rbTEqch9gz5CvyIPL3kBohicI/k+/RYPnRKsTdiYNE\nXrpeaarHqlvpGzjsrQUv6iJgrDGZXMVJn+op3cDChNPet9RJ1utH96S6W6Ent4QU\n90XNi6fBSja8wThfj0AAl51OycHwfNg5/CtygT0eM16/bZl0knJ884Bf35LNE731\nAwp8H6ELyXOX1tRKNZRPMKr2Nw/qn6QK611R9aSA+maa25YZa8K0cvSVAJQOfdei\n0A7YVKj492nqnN/xS5kzIidZuaCBLocLo5j615xh/79YgMZjrGo3wvnk\n-----END CERTIFICATE REQUEST-----\n",
                  "profile_id": "\u003cprofile-id\u003e",
                  "timeout_seconds": 300,
                  "ttl": "90d"
                }
              dependencies:
                infisical_cert_manager_application.platform: |-
                    {
                      "description": "Certificates issued for the platform team",
                      "name": "platform"
                    }
        argumentDocs:
            alt_names: (List of String) Subject alternative names (SANs) for the certificate
            application_id: (String) The ID of the Certificate Manager application to issue this certificate from
            certificate: (String) The issued certificate in PEM format.
            certificate_chain: (String) The certificate chain in PEM format.
            certificate_request_id: (String) The ID of the certificate request
            common_name: (String) The common name (CN) for the certificate. Required when not using CSR
            country: (String) The country (C) for the certificate (2-letter code)
            csr: (String) Certificate Signing Request (CSR) in PEM format. If provided, the certificate will be issued based on the CSR. Use Terraform's file() function to read from a file (e.g., file("./my-certificate.csr")).
            domain_components: (List of String) Domain components (DC) for the certificate. Multi-valued; each entry becomes a DC attribute in the subject.
            extended_key_usages: '(List of String) Extended key usages for the certificate. Supported: client_auth, server_auth, code_signing, email_protection, ocsp_signing, time_stamping'
            id: (String) The ID of the certificate
            key_algorithm: '(String) The key algorithm for the certificate. Supported: RSA_2048, RSA_3072, RSA_4096, EC_prime256v1, EC_secp384r1, EC_secp521r1'
            key_usages: '(List of String) Key usages for the certificate. Supported: digital_signature, key_encipherment, non_repudiation, data_encipherment, key_agreement, key_cert_sign, crl_sign, encipher_only, decipher_only'
            locality: (String) The locality (L) for the certificate
            not_after: (String) The not-after (expiration) date of the certificate (RFC3339 format)
            not_before: (String) The not-before date of the certificate (RFC3339 format)
            organization: (String) The organization (O) for the certificate
            ou: (String) The organizational unit (OU) for the certificate
            private_key: (String, Sensitive) The private key in PEM format (only available for direct field requests, not CSR-based).
            profile_id: (String) The ID of the certificate profile to use for issuance
            province: (String) The state/province (ST) for the certificate
            serial_number: (String) The serial number of the issued certificate
            signature_algorithm: '(String) The signature algorithm for the certificate. Supported: RSA-SHA256, RSA-SHA384, RSA-SHA512, ECDSA-SHA256, ECDSA-SHA384, ECDSA-SHA512'
            status: (String) The status of the certificate (pending, issued, failed)
            timeout_seconds: (Number) Maximum time to wait for certificate issuance in seconds. Defaults to 3600 (1 hour)
            ttl: (String) Time to live for the certificate (e.g., '30d', '90d', '1y').
        importStatements:
            - |-
              # This will import the certificate by its ID
              terraform import infisical_cert_manager_certificate.example <certificate_id>
    infisical_cert_manager_certificate_policy:
        subCategory: Certificate Management
        description: Create and manage certificate policies in Certificate Manager. Only Machine Identity authentication is supported for this resource.
        name: infisical_cert_manager_certificate_policy
        title: infisical_cert_manager_certificate_policy Resource - terraform-provider-infisical
        examples:
            - name: web_server
              manifest: |-
                {
                  "algorithms": [
                    {
                      "key_algorithm": [
                        "RSA-2048",
                        "RSA-3072",
                        "ECDSA-P256",
                        "ECDSA-P384"
                      ],
                      "signature": [
                        "SHA256-RSA",
                        "SHA256-ECDSA",
                        "SHA384-ECDSA"
                      ]
                    }
                  ],
                  "basic_constraints": [
                    {
                      "is_ca": "denied"
                    }
                  ],
                  "description": "Policy for web server certificates",
                  "extended_key_usages": [
                    {
                      "allowed": [
                        "server_auth",
                        "client_auth"
                      ]
                    }
                  ],
                  "key_usages": [
                    {
                      "allowed": [
                        "digital_signature",
                        "key_encipherment"
                      ]
                    }
                  ],
                  "name": "web-server-policy",
                  "sans": [
                    {
                      "allowed": [
                        "*.example.com",
                        "*.internal.example.com"
                      ],
                      "required": [
                        "*.example.com"
                      ],
                      "type": "dns_name"
                    },
                    {
                      "allowed": [
                        "*@example.com"
                      ],
                      "type": "email"
                    },
                    {
                      "allowed": [
                        "10.0.0.0/8",
                        "192.168.0.0/16"
                      ],
                      "type": "ip_address"
                    }
                  ],
                  "subject": [
                    {
                      "allowed": [
                        "*.example.com",
                        "*.internal.example.com"
                      ],
                      "required": [
                        "*.example.com"
                      ],
                      "type": "common_name"
                    },
                    {
                      "required": [
                        "Example Corp"
                      ],
                      "type": "organization"
                    },
                    {
                      "required": [
                        "US"
                      ],
                      "type": "country"
                    }
                  ],
                  "validity": [
                    {
                      "max": "90d"
                    }
                  ]
                }
            - name: intermediate_ca
              manifest: |-
                {
                  "algorithms": [
                    {
                      "key_algorithm": [
                        "RSA-4096",
                        "ECDSA-P384"
                      ],
                      "signature": [
                        "SHA256-RSA",
                        "SHA384-ECDSA"
                      ]
                    }
                  ],
                  "basic_constraints": [
                    {
                      "is_ca": "required",
                      "max_path_length": 1
                    }
                  ],
                  "description": "Policy for intermediate CA certificates",
                  "key_usages": [
                    {
                      "required": [
                        "key_cert_sign",
                        "crl_sign"
                      ]
                    }
                  ],
                  "name": "intermediate-ca-policy",
                  "subject": [
                    {
                      "required": [
                        "Example Corp Intermediate CA"
                      ],
                      "type": "common_name"
                    },
                    {
                      "required": [
                        "Example Corp"
                      ],
                      "type": "organization"
                    },
                    {
                      "allowed": [
                        "PKI",
                        "Security"
                      ],
                      "type": "organizational_unit"
                    },
                    {
                      "required": [
                        "US"
                      ],
                      "type": "country"
                    },
                    {
                      "allowed": [
                        "California"
                      ],
                      "type": "state"
                    },
                    {
                      "allowed": [
                        "San Francisco"
                      ],
                      "type": "locality"
                    }
                  ],
                  "validity": [
                    {
                      "max": "5y"
                    }
                  ]
                }
            - name: code_signing
              manifest: |-
                {
                  "algorithms": [
                    {
                      "key_algorithm": [
                        "RSA-2048",
                        "RSA-3072",
                        "ECDSA-P256"
                      ],
                      "signature": [
                        "SHA256-RSA",
                        "SHA256-ECDSA"
                      ]
                    }
                  ],
                  "description": "Policy for code signing certificates",
                  "extended_key_usages": [
                    {
                      "allowed": [
                        "code_signing"
                      ]
                    }
                  ],
                  "key_usages": [
                    {
                      "allowed": [
                        "digital_signature"
                      ]
                    }
                  ],
                  "name": "code-signing-policy",
                  "subject": [
                    {
                      "allowed": [
                        "Example Corp Code Signing"
                      ],
                      "required": [
                        "Example Corp Code Signing"
                      ],
                      "type": "common_name"
                    },
                    {
                      "required": [
                        "Example Corp"
                      ],
                      "type": "organization"
                    },
                    {
                      "required": [
                        "US"
                      ],
                      "type": "country"
                    }
                  ],
                  "validity": [
                    {
                      "max": "1y"
                    }
                  ]
                }
        argumentDocs:
            algorithms: (Block, Optional) Algorithm constraints for the certificate policy. Omit the block to accept any algorithm; each list restricts its own kind independently and needs at least one value when set. (see below for nested schema)
            allowed: '(List of String) List of allowed extended key usages. Possible values: client_auth, server_auth, code_signing, email_protection, ocsp_signing, time_stamping'
            basic_constraints: (Block, Optional) Basic constraints policy for the certificate policy, controlling whether issued certificates may act as certificate authorities. (see below for nested schema)
            denied: '(List of String) List of denied extended key usages. Possible values: client_auth, server_auth, code_signing, email_protection, ocsp_signing, time_stamping'
            description: (String) The description of the certificate policy (max 255 characters). Omit the attribute instead of passing an empty string.
            extended_key_usages: (Block, Optional) Extended key usage policies for the certificate policy. When this block is present, requested extended key usages must be within the union of allowed and required; setting allowed and required to empty lists denies all extended key usages. Omit the block for no constraint. (see below for nested schema)
            id: (String) The ID of the certificate policy
            is_ca: '(String) Policy for the CA flag (basic constraints CA:TRUE) on issued certificates. Possible values: allowed, required, denied'
            key_algorithm: '(List of String) List of allowed key algorithms (at least one value when set). Supported values: RSA-2048, RSA-3072, RSA-4096, ECDSA-P256, ECDSA-P521, ECDSA-P384'
            key_usages: (Block, Optional) Key usage policies for the certificate policy. When this block is present, requested key usages must be within the union of allowed and required; setting allowed and required to empty lists denies all key usages. Omit the block for no constraint. (see below for nested schema)
            max: (String) Maximum validity period (e.g., '90d', '2y', '6m')
            max_path_length: (Number) Maximum path length constraint for CA certificates. Use -1 for unlimited, or a non-negative integer to cap how many intermediate CAs may appear below a certificate issued under this policy. Only applies when is_ca is allowed or required; it is ignored when is_ca is denied.
            name: '(String) The name of the certificate policy. Must be in slug format: lowercase letters and numbers, separated by single hyphens (e.g. ''web-server-policy'').'
            required: '(List of String) List of required extended key usages. Possible values: client_auth, server_auth, code_signing, email_protection, ocsp_signing, time_stamping'
            sans: (Block List) Subject alternative name (SAN) policies for the certificate policy (see below for nested schema)
            signature: '(List of String) List of allowed signature algorithms (at least one value when set). Supported values: SHA256-RSA, SHA512-RSA, SHA384-ECDSA, SHA384-RSA, SHA256-ECDSA, SHA512-ECDSA'
            subject: '(Block List) Subject attribute policies for the certificate policy. Each block constrains a single subject DN attribute (e.g. common_name, organization). Values are matched against the corresponding attribute parsed from the CSR; the ''*'' wildcard matches any sequence of characters (including dots). common_name matches the CN attribute only. domain_component (DC) is an independent attribute matched separately from common_name: a certificate may carry multiple DC values, and each is matched individually against this block. (see below for nested schema)'
            type: '(String) The SAN type. Possible values: dns_name, ip_address, email, uri'
            validity: (Block, Optional) Validity constraints for the certificate policy (see below for nested schema)
        importStatements:
            - |-
              # This will import the certificate policy by its ID
              terraform import infisical_cert_manager_certificate_policy.example <policy_id>
    infisical_cert_manager_certificate_profile:
        subCategory: Certificate Management
        description: Create and manage certificate profiles in Certificate Manager. Enrollment methods are configured on the application via the infisical_cert_manager_application_profile resource. Only Machine Identity authentication is supported for this resource.
        name: infisical_cert_manager_certificate_profile
        title: infisical_cert_manager_certificate_profile Resource - terraform-provider-infisical
        examples:
            - name: web_server
              manifest: |-
                {
                  "ca_id": "${infisical_cert_manager_internal_ca.issuing.id}",
                  "certificate_policy_id": "${infisical_cert_manager_certificate_policy.web_server.id}",
                  "defaults": [
                    {
                      "common_name": "service.example.com",
                      "extended_key_usages": [
                        "server_auth"
                      ],
                      "key_algorithm": "RSA_2048",
                      "key_usages": [
                        "digital_signature"
                      ],
                      "signature_algorithm": "RSA-SHA256",
                      "ttl_days": 90
                    }
                  ],
                  "description": "Profile for issuing web server certificates",
                  "issuer_type": "ca",
                  "name": "web-server"
                }
              references:
                ca_id: infisical_cert_manager_internal_ca.issuing.id
                certificate_policy_id: infisical_cert_manager_certificate_policy.web_server.id
              dependencies:
                infisical_cert_manager_certificate_policy.web_server: |-
                    {
                      "algorithms": [
                        {
                          "key_algorithm": [
                            "RSA-2048",
                            "RSA-3072"
                          ],
                          "signature": [
                            "SHA256-RSA"
                          ]
                        }
                      ],
                      "description": "Policy for web server certificates",
                      "extended_key_usages": [
                        {
                          "allowed": [
                            "server_auth",
                            "client_auth"
                          ]
                        }
                      ],
                      "key_usages": [
                        {
                          "allowed": [
                            "digital_signature",
                            "key_encipherment"
                          ]
                        }
                      ],
                      "name": "web-server-policy",
                      "sans": [
                        {
                          "allowed": [
                            "*.example.com"
                          ],
                          "required": [
                            "*.example.com"
                          ],
                          "type": "dns_name"
                        }
                      ],
                      "subject": [
                        {
                          "allowed": [
                            "*.example.com"
                          ],
                          "required": [
                            "*.example.com"
                          ],
                          "type": "common_name"
                        },
                        {
                          "required": [
                            "Example Corp"
                          ],
                          "type": "organization"
                        }
                      ],
                      "validity": [
                        {
                          "max": "90d"
                        }
                      ]
                    }
                infisical_cert_manager_internal_ca.issuing: |-
                    {
                      "common_name": "Enterprise Issuing Certificate Authority",
                      "country": "US",
                      "key_algorithm": "RSA_2048",
                      "locality": "San Francisco",
                      "name": "enterprise-issuing-ca",
                      "organization": "Example Corp",
                      "ou": "IT Security",
                      "province": "California",
                      "type": "intermediate"
                    }
            - name: self_signed_dev
              manifest: |-
                {
                  "certificate_policy_id": "${infisical_cert_manager_certificate_policy.web_server.id}",
                  "defaults": [
                    {
                      "common_name": "dev.example.com",
                      "extended_key_usages": [
                        "server_auth"
                      ],
                      "key_algorithm": "RSA_2048",
                      "key_usages": [
                        "digital_signature"
                      ],
                      "signature_algorithm": "RSA-SHA256",
                      "ttl_days": 90
                    }
                  ],
                  "description": "Self-signed certificates for development",
                  "issuer_type": "self-signed",
                  "name": "self-signed-dev"
                }
              references:
                certificate_policy_id: infisical_cert_manager_certificate_policy.web_server.id
              dependencies:
                infisical_cert_manager_certificate_policy.web_server: |-
                    {
                      "algorithms": [
                        {
                          "key_algorithm": [
                            "RSA-2048",
                            "RSA-3072"
                          ],
                          "signature": [
                            "SHA256-RSA"
                          ]
                        }
                      ],
                      "description": "Policy for web server certificates",
                      "extended_key_usages": [
                        {
                          "allowed": [
                            "server_auth",
                            "client_auth"
                          ]
                        }
                      ],
                      "key_usages": [
                        {
                          "allowed": [
                            "digital_signature",
                            "key_encipherment"
                          ]
                        }
                      ],
                      "name": "web-server-policy",
                      "sans": [
                        {
                          "allowed": [
                            "*.example.com"
                          ],
                          "required": [
                            "*.example.com"
                          ],
                          "type": "dns_name"
                        }
                      ],
                      "subject": [
                        {
                          "allowed": [
                            "*.example.com"
                          ],
                          "required": [
                            "*.example.com"
                          ],
                          "type": "common_name"
                        },
                        {
                          "required": [
                            "Example Corp"
                          ],
                          "type": "organization"
                        }
                      ],
                      "validity": [
                        {
                          "max": "90d"
                        }
                      ]
                    }
                infisical_cert_manager_internal_ca.issuing: |-
                    {
                      "common_name": "Enterprise Issuing Certificate Authority",
                      "country": "US",
                      "key_algorithm": "RSA_2048",
                      "locality": "San Francisco",
                      "name": "enterprise-issuing-ca",
                      "organization": "Example Corp",
                      "ou": "IT Security",
                      "province": "California",
                      "type": "intermediate"
                    }
        argumentDocs:
            ca_id: (String) The ID of the certificate authority to use (required unless issuer_type is 'self-signed')
            certificate_policy_id: (String) The ID of the certificate policy to use
            common_name: (String) Default common name
            country: (String) Default country (C)
            defaults: (Block, Optional) Default certificate attribute values applied when issuing certificates from this profile (see below for nested schema)
            description: (String) The description of the certificate profile
            domain_components: (List of String) Default domain components (DC). Multi-valued; each entry becomes a DC attribute in the certificate subject.
            extended_key_usages: '(List of String) Default extended key usages. Supported values: client_auth, server_auth, code_signing, email_protection, ocsp_signing, time_stamping'
            id: (String) The ID of the certificate profile
            issuer_type: '(String) The issuer type for the profile. Supported values: ca, self-signed. Defaults to ''ca''.'
            key_algorithm: '(String) Default key algorithm. Supported values: RSA_2048, RSA_3072, RSA_4096, EC_prime256v1, EC_secp384r1, EC_secp521r1'
            key_usages: '(List of String) Default key usages. Supported values: digital_signature, key_encipherment, non_repudiation, data_encipherment, key_agreement, key_cert_sign, crl_sign, encipher_only, decipher_only'
            locality: (String) Default locality (L)
            name: (String) The unique name of the certificate profile
            organization: (String) Default organization (O)
            organizational_unit: (String) Default organizational unit (OU)
            signature_algorithm: '(String) Default signature algorithm. Supported values: RSA-SHA256, RSA-SHA384, RSA-SHA512, ECDSA-SHA256, ECDSA-SHA384, ECDSA-SHA512'
            state: (String) Default state/province (ST)
            ttl_days: (Number) Default certificate validity in days
        importStatements:
            - |-
              # This will import the certificate profile by its ID
              terraform import infisical_cert_manager_certificate_profile.example <profile_id>
