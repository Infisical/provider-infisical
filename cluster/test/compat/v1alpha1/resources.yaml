# v1alpha1 managed resources for the Crossplane compatibility tests
# (cluster/test/compat.sh). They use the v1alpha1 API, which the released
# provider also serves.
#
# Placeholders that compat.sh replaces before it applies this file:
#   __RUN_ID__      unique suffix for each test run
#   __ORG_ID__      Infisical organization ID
#   __USER_EMAIL__  email of an existing user in the organization
#   __GITHUB_*__    GitHub secret sync settings (see SecretSyncGithub below)
#
# Labels:
#   compat.infisical.com/test: "true"   every MR that the test owns
#   compat.infisical.com/tier: ready    the MR must become Ready=True (live mode)
#   compat.infisical.com/tier: synced   the MR only needs a Synced condition. Use
#                                       this for resources that need external
#                                       services or a license.
#   compat.infisical.com/new-provider-tier
#                                       the tier when the provider under test
#                                       creates the MR (fresh mode, and all
#                                       v1alpha2 MRs). Use this for known gaps of
#                                       the normal Terraform provider.
apiVersion: project.crossplane.infisical.com/v1alpha1
kind: Project
metadata:
  name: compat-project
  labels:
    compat.infisical.com/test: "true"
    compat.infisical.com/tier: ready
spec:
  forProvider:
    name: compat-__RUN_ID__
    slug: compat-__RUN_ID__
    type: secret-manager
    description: crossplane compatibility test
---
apiVersion: project.crossplane.infisical.com/v1alpha1
kind: ProjectEnvironment
metadata:
  name: compat-environment
  labels:
    compat.infisical.com/test: "true"
    compat.infisical.com/tier: ready
spec:
  forProvider:
    name: compat
    slug: compat
    projectIdRef:
      name: compat-project
---
apiVersion: secret.crossplane.infisical.com/v1alpha1
kind: SecretFolder
metadata:
  name: compat-folder
  labels:
    compat.infisical.com/test: "true"
    compat.infisical.com/tier: ready
spec:
  forProvider:
    name: compat-folder
    environmentSlug: dev
    folderPath: /
    projectIdRef:
      name: compat-project
---
apiVersion: identity.crossplane.infisical.com/v1alpha1
kind: Identity
metadata:
  name: compat-identity
  labels:
    compat.infisical.com/test: "true"
    compat.infisical.com/tier: ready
spec:
  forProvider:
    name: compat-__RUN_ID__
    orgId: __ORG_ID__
    role: member
---
apiVersion: identity.crossplane.infisical.com/v1alpha1
kind: Identity
metadata:
  name: compat-identity-k8s
  labels:
    compat.infisical.com/test: "true"
    compat.infisical.com/tier: ready
spec:
  forProvider:
    name: compat-k8s-__RUN_ID__
    orgId: __ORG_ID__
    role: member
---
apiVersion: identity.crossplane.infisical.com/v1alpha1
kind: UniversalAuth
metadata:
  name: compat-universal-auth
  labels:
    compat.infisical.com/test: "true"
    compat.infisical.com/tier: ready
spec:
  forProvider:
    identityIdRef:
      name: compat-identity
---
# Infisical calls the Kubernetes API of kubernetesHost when the auth method is
# created, and the test has no Kubernetes API that the Infisical server can
# reach. The test only checks that the controller reconciles this kind.
apiVersion: identity.crossplane.infisical.com/v1alpha1
kind: KubernetesAuth
metadata:
  name: compat-kubernetes-auth
  labels:
    compat.infisical.com/test: "true"
    compat.infisical.com/tier: synced
spec:
  forProvider:
    identityIdRef:
      name: compat-identity-k8s
    kubernetesHost: https://example.com
    allowedNamespaces:
      - compat
    tokenReviewerMode: api
    tokenReviewerJwt: compat-test-token
---
apiVersion: project.crossplane.infisical.com/v1alpha1
kind: ProjectIdentity
metadata:
  name: compat-project-identity
  labels:
    compat.infisical.com/test: "true"
    compat.infisical.com/tier: ready
spec:
  forProvider:
    projectIdRef:
      name: compat-project
    identityIdRef:
      name: compat-identity
    roles: '[{"role_slug":"viewer"}]'
---
apiVersion: project.crossplane.infisical.com/v1alpha1
kind: ProjectUser
metadata:
  name: compat-project-user
  labels:
    compat.infisical.com/test: "true"
    compat.infisical.com/tier: ready
spec:
  forProvider:
    projectIdRef:
      name: compat-project
    username: __USER_EMAIL__
    roles: '[{"role_slug":"viewer"}]'
---
apiVersion: project.crossplane.infisical.com/v1alpha1
kind: ProjectRole
metadata:
  name: compat-project-role
  labels:
    compat.infisical.com/test: "true"
    compat.infisical.com/tier: ready
    # Known gap: the ProjectRole Read of the normal Terraform provider (0.20.1)
    # returns an error instead of removing the resource when the role is not
    # found, so a NEW ProjectRole is never created. Existing ones keep working.
    compat.infisical.com/new-provider-tier: synced
spec:
  forProvider:
    name: compat-role
    slug: compat-role
    projectSlug: compat-__RUN_ID__
    description: crossplane compatibility test
    permissions: '[{"action":["read"],"subject":"secrets","conditions":{"environment":{"$eq":"dev"},"secretPath":{"$eq":"/"}}}]'
---
apiVersion: project.crossplane.infisical.com/v1alpha1
kind: AccessApprovalPolicy
metadata:
  name: compat-access-approval-policy
  labels:
    compat.infisical.com/test: "true"
    compat.infisical.com/tier: ready
spec:
  forProvider:
    name: compat-access-policy
    projectIdRef:
      name: compat-project
    environmentSlugs:
      - prod
    secretPath: /
    requiredApprovals: 1
    enforcementLevel: soft
    userApprovers:
      - __USER_EMAIL__
---
apiVersion: project.crossplane.infisical.com/v1alpha1
kind: SecretApprovalPolicy
metadata:
  name: compat-secret-approval-policy
  labels:
    compat.infisical.com/test: "true"
    compat.infisical.com/tier: ready
spec:
  forProvider:
    name: compat-secret-policy
    projectIdRef:
      name: compat-project
    environmentSlugs:
      - prod
    secretPath: /
    requiredApprovals: 1
    enforcementLevel: soft
    userApprovers:
      - __USER_EMAIL__
---
apiVersion: group.crossplane.infisical.com/v1alpha1
kind: Group
metadata:
  name: compat-group
  labels:
    compat.infisical.com/test: "true"
    compat.infisical.com/tier: ready
spec:
  forProvider:
    name: compat-__RUN_ID__
    slug: compat-__RUN_ID__
    role: member
---
apiVersion: project.crossplane.infisical.com/v1alpha1
kind: ProjectGroup
metadata:
  name: compat-project-group
  labels:
    compat.infisical.com/test: "true"
    compat.infisical.com/tier: ready
spec:
  forProvider:
    projectIdRef:
      name: compat-project
    groupIdRef:
      name: compat-group
    roles: '[{"role_slug":"viewer"}]'
---
apiVersion: project.crossplane.infisical.com/v1alpha1
kind: ProjectTemplate
metadata:
  name: compat-project-template
  labels:
    compat.infisical.com/test: "true"
    compat.infisical.com/tier: ready
spec:
  forProvider:
    name: compat-__RUN_ID__
    type: secret-manager
    description: crossplane compatibility test
    environments: '[{"name":"development","slug":"dev","position":1}]'
---
# A GitHub secret sync to the repository in INFISICAL_GITHUB_REPO_OWNER and
# INFISICAL_GITHUB_REPO_NAME, through the GitHub App connection in
# INFISICAL_GITHUB_CONNECTION_ID. When these are not set, compat.sh uses
# placeholder values and the tier "synced", so the test only checks that the
# controller reconciles this kind.
#
# The sync is safe for a real repository: secret deletion is disabled, so it
# never removes secrets that exist in the repository, and the key schema adds
# the prefix COMPAT_. The synced environment has no secrets.
apiVersion: secretsync.crossplane.infisical.com/v1alpha1
kind: SecretSyncGithub
metadata:
  name: compat-secret-sync-github
  labels:
    compat.infisical.com/test: "true"
    compat.infisical.com/tier: __GITHUB_SYNC_TIER__
spec:
  forProvider:
    name: compat-sync-__RUN_ID__
    connectionId: __GITHUB_CONNECTION_ID__
    environment: dev
    secretPath: /
    projectIdRef:
      name: compat-project
    destinationConfig: '{"scope":"repository","repository_owner":"__GITHUB_REPO_OWNER__","repository_name":"__GITHUB_REPO_NAME__"}'
    syncOptions: '{"initial_sync_behavior":"overwrite-destination","disable_secret_deletion":true,"key_schema":"COMPAT_{{secretKey}}"}'
