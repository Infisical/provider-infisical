# The Secret MR has no reference to a Project, so compat.sh applies it after
# the Project is ready and replaces __PROJECT_ID__ with the project ID.
apiVersion: v1
kind: Secret
metadata:
  name: compat-secret-value
  namespace: crossplane-system
stringData:
  value: compat-value
---
apiVersion: secret.crossplane.infisical.com/v1alpha1
kind: Secret
metadata:
  name: compat-secret
  labels:
    compat.infisical.com/test: "true"
    # The released provider (v0.1.15) cannot create a new Secret either: its
    # first refresh reads the secret with an empty ID and the API returns 400.
    # The test keeps that behavior 1:1 and only checks that the MR reconciles.
    compat.infisical.com/tier: synced
spec:
  forProvider:
    name: COMPAT_SECRET
    envSlug: dev
    folderPath: /
    workspaceId: __PROJECT_ID__
    valueSecretRef:
      name: compat-secret-value
      namespace: crossplane-system
      key: value
