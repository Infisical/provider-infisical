apiVersion: secretvalidationrule.crossplane.infisical.com/v1alpha2
kind: SecretValidationRuleStaticSecrets
metadata:
  annotations:
    meta.upbound.io/example-id: secretvalidationrule/v1alpha2/secretvalidationrulestaticsecrets
  labels:
    testing.upbound.io/example-name: static-secrets
  name: static-secrets
spec:
  forProvider:
    constraints:
      keyConstraints:
        regexPattern: ^[A-Z][A-Z0-9_]*$
        requiredPrefix: APP_
      valueConstraints:
        maxLength: 128
        minLength: 16
        uniqueAcrossLastVersions: 10
        uniqueWithinScope: true
    environment: <environment-slug>
    name: static-secrets-validation-rule-example
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: /**
