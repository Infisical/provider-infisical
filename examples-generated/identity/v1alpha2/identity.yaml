apiVersion: identity.crossplane.infisical.com/v1alpha2
kind: Identity
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1alpha2/identity
  labels:
    testing.upbound.io/example-name: universal-auth
  name: universal-auth
spec:
  forProvider:
    metadata:
    - key: key1
      value: value1
    - key: key2
      value: value2
    name: universal-auth
    orgId: <org_id>
    role: member

---

apiVersion: identity.crossplane.infisical.com/v1alpha2
kind: KubernetesAuth
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1alpha2/identity
  labels:
    testing.upbound.io/example-name: k8-auth
  name: k8-auth
spec:
  forProvider:
    allowedNamespaces:
    - namespace-a
    - namespace-b
    identityIdSelector:
      matchLabels:
        testing.upbound.io/example-name: k8-auth
    kubernetesHost: http://example.com
    tokenReviewerJwt: ey<example>

---

apiVersion: identity.crossplane.infisical.com/v1alpha2
kind: UniversalAuth
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1alpha2/identity
  labels:
    testing.upbound.io/example-name: ua-auth
  name: ua-auth
spec:
  forProvider:
    accessTokenMaxTtl: ${2592000 * 2}
    accessTokenNumUsesLimit: 3
    accessTokenTtl: 2592000
    identityIdSelector:
      matchLabels:
        testing.upbound.io/example-name: universal-auth
