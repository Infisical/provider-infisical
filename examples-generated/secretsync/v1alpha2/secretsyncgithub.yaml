apiVersion: secretsync.crossplane.infisical.com/v1alpha2
kind: SecretSyncGithub
metadata:
  annotations:
    meta.upbound.io/example-id: secretsync/v1alpha2/secretsyncgithub
  labels:
    testing.upbound.io/example-name: example-github-secret-sync
  name: example-github-secret-sync
spec:
  forProvider:
    connectionId: <github-app-connection-id>
    description: Demo of Github secret sync
    destinationConfig:
      repositoryName: <github-repository-name>
      repositoryOwner: <github-repository-owner>
      scope: repository
    environment: <environment-slug>
    name: github-secret-sync-demo
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: /
    syncOptions:
      disableSecretDeletion: false
      initialSyncBehavior: overwrite-destination
      keySchema: INFISICAL_{{secretKey}}
