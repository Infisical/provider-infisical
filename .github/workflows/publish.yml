name: Publish Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.8"
  DOCKER_BUILDX_VERSION: "v0.8.2"

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check the release tag
        run: |
          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error title=Not a release tag::${RELEASE_TAG} is not a release version (vMAJOR.MINOR.PATCH). Nothing is published."
            exit 1
          fi

      - name: Checkout the tag
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          submodules: true

      - name: Setup QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true

      - name: Login to Upbound
        uses: docker/login-action@v3
        with:
          registry: xpkg.upbound.io
          username: ${{ secrets.UPBOUND_MARKETPLACE_PUSH_ROBOT_USR }}
          password: ${{ secrets.UPBOUND_MARKETPLACE_PUSH_ROBOT_PSW }}

      - name: Setup Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check that the version is not published yet
        run: make release.check RELEASE_TAG="${RELEASE_TAG}" VERSION="${RELEASE_TAG}"

      - name: Build
        run: make -j2 build.all VERSION="${RELEASE_TAG}"
        env:
          # docker buildx does not load the images it builds by default.
          BUILD_ARGS: "--load"

      - name: Publish
        run: make release.publish RELEASE_TAG="${RELEASE_TAG}" VERSION="${RELEASE_TAG}"
